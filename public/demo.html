/* ---------------- motion helpers ---------------- */
function countUp(el){
  const to=parseFloat(el.dataset.count),dec=+(el.dataset.dec||0),suf=el.dataset.suf||'';
  if(RM||isNaN(to)){el.textContent=to.toFixed(dec)+suf;return;}
  const t0=performance.now(),d=900;
  const f=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec)+suf;if(k<1)requestAnimationFrame(f);};
  requestAnimationFrame(f);
}
let io=null;
function motion(root){
  if(io)io.disconnect();
  const els=$$('.card,.kpi,.qcard,.sl,.deck-stage',root);
  if(RM||!window.IntersectionObserver){els.forEach(e=>e.classList.add('in'));$$('[data-count]',root).forEach(countUp);return;}
  els.forEach(e=>e.classList.add('rvl'));
  io=new IntersectionObserver(es=>{let k=0;es.forEach(en=>{if(!en.isIntersecting)return;const e=en.target;e.style.transitionDelay=Math.min(k++*45,300)+'ms';e.classList.add('in');$$('[data-count]',e).forEach(countUp);if(e.matches('[data-count]'))countUp(e);io.unobserve(e);});},{threshold:.12});
  els.forEach(e=>io.observe(e));
  $$('[data-count]',root).forEach(e=>{if(!e.closest('.rvl'))countUp(e);});
}
function burst(el,color='var(--ok)'){
  if(RM||!el)return;const r=el.getBoundingClientRect();
  for(let i=0;i<14;i++){const d=document.createElement('i');d.className='burst';const a=i/14*Math.PI*2,dist=34+Math.random()*26;
    d.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${i%3?color:'var(--accent)'};--x:${Math.cos(a)*dist}px;--y:${Math.sin(a)*dist}px`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),700);}
}

/* AI working panel */
function aiRun(title,steps,done,finish){
  const box=$('#airun');
  box.innerHTML=`<div class="airun-in"><span class="orb">${ico('spark')}</span><div class="airun-t"><b>${title}</b><ul>${steps.map(s=>`<li>${s}</li>`).join('')}</ul></div></div>`;
  box.classList.remove('done');box.classList.add('open');
  const lis=$$('li',box),dt=RM?120:620;let k=0;
  const step=()=>{if(k>0)lis[k-1].className='ok';if(k<lis.length){lis[k].className='on';k++;setTimeout(step,dt);return;}
    box.classList.add('done');box.querySelector('b').textContent=finish||'Done';
    setTimeout(()=>{done&&done();},RM?100:420);setTimeout(()=>box.classList.remove('open'),RM?600:1500);};
  step();
}

function importModal(){
  openModal(`<div class="mh"><h2>Import a questionnaire</h2><button class="x" data-close aria-label="Close">${ico('x')}</button></div>
    <div class="mb"><label class="drop" id="drop"><input type="file" id="fileIn" accept=".docx" hidden><span class="drop-ic"><span class="ico ico-word"></span></span><b>Drop a Word file or browse</b><small>.docx only. Dedale AI reads each question, its options and its logic.</small></label>
    <div class="drop-err" id="dropErr" hidden>${ico('alert')}<div><b>This file is not a Word document</b><small id="dropErrT"></small></div><button class="btn btn-ghost" id="retry">Try again</button></div></div>
    <div class="mf"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="sample">${ico('file')}Use a sample file</button></div>`);
  const ok=name=>{closeModal();aiRun('Dedale AI is importing '+name,['Reading the document','Detecting 27 questions and their types','Mapping logic and quotas'],()=>{location.hash=href('questionnaire','builder','gov');setTimeout(()=>toast('27 questions imported into GovTech Survey'),500);},'Questionnaire imported');};
  const bad=name=>{$('#drop').hidden=true;$('#dropErr').hidden=false;$('#dropErrT').textContent=`${name} cannot be imported. Save it as .docx and try again.`;};
  $('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;/\.docx$/i.test(f.name)?ok(f.name):bad(f.name);});
  const d=$('#drop');['dragover','dragenter'].forEach(t=>d.addEventListener(t,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(t=>d.addEventListener(t,()=>d.classList.remove('over')));
  d.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)/\.docx$/i.test(f.name)?ok(f.name):bad(f.name);});
  $('#retry').addEventListener('click',()=>{$('#drop').hidden=false;$('#dropErr').hidden=true;});
  $('#sample').addEventListener('click',()=>ok('GovTech_Questionnaire_v1.docx'));
}

function rqHTML(q,a={},ix=false){
  const v=a[q.no],ti=ix?'':'tabindex="-1"';let body='';
  if(q.type==='single'||q.type==='multi')body=`<div class="rq-opts">${q.opts.map((o,i)=>{const on=q.type==='multi'?(v||[]).includes(i):v===i;return `<button class="rq-o ${on?'on':''}" data-o="${i}" ${ti}><span class="rq-mk ${q.type==='multi'?'sq':''}">${on?ico('check'):''}</span>${esc(o)}</button>`;}).join('')}</div>`;
  else if(q.type==='dropdown')body=`<label class="rq-dd"><select data-dd ${ti} aria-label="Answer"><option value="">Select an answer</option>${q.opts.map((o,i)=>`<option value="${i}" ${v===i?'selected':''}>${esc(o)}</option>`).join('')}</select>${ico('chevD')}</label>`;
  else if(q.type==='rank'||q.type==='rankall'){const r=v||[];body=`<p class="rq-hint">Tap in order of importance. ${q.type==='rankall'?'Rank all '+q.opts.length:'Pick '+rankNeed(q)}.</p><div class="rq-opts">${q.opts.map((o,i)=>{const k=r.indexOf(i);return `<button class="rq-o rk ${k>=0?'on':''}" data-r="${i}" ${ti}><span class="rq-rk">${k>=0?k+1:''}</span>${esc(o)}</button>`;}).join('')}</div>`;}
  else if(q.type==='maxdiff'){const g=v||{};body=`<p class="rq-hint">Pick the most and the least important.</p><div class="rq-md"><div class="rq-mdr h"><span>Most</span><span></span><span>Least</span></div>${q.opts.map((o,i)=>`<div class="rq-mdr"><button class="${g.b===i?'on':''}" data-md="b${i}" aria-label="Most important: ${esc(o)}" ${ti}>${g.b===i?ico('check'):''}</button><span>${esc(o)}</span><button class="w ${g.w===i?'on':''}" data-md="w${i}" aria-label="Least important: ${esc(o)}" ${ti}>${g.w===i?ico('check'):''}</button></div>`).join('')}</div>`;}
  else if(q.type==='msingle'||q.type==='mmulti'){const g=v||{},n=q.opts.length,multi=q.type==='mmulti';body=`<p class="rq-hint">${multi?'Select all that apply on each row.':'One answer per row.'}</p><div class="rq-mx" style="--n:${n}"><div class="rq-mxr h"><span></span>${q.opts.map(o=>`<em>${esc(o)}</em>`).join('')}</div>${q.rows.map((r,i)=>`<div class="rq-mxr"><span>${esc(r)}</span>${q.opts.map((o,j)=>{const on=multi?(g[i]||[]).includes(j):g[i]===j;return `<button class="${multi?'sq':''} ${on?'on':''}" data-mx="${i}:${j}" aria-label="${esc(r)}: ${esc(o)}" ${ti}>${on?ico('check'):''}</button>`;}).join('')}</div>`).join('')}</div>`;}
  else if(q.type==='scale')body=`<div class="rq-scale">${[...Array(11)].map((_,i)=>`<button class="${v===i?'on':''}" data-s="${i}" ${ti}>${i}</button>`).join('')}</div><div class="rq-ends"><span>Not at all</span><span>Extremely</span></div>`;
  else if(q.type==='likert')body=`<div class="rq-opts">${LIKERT.map((l,i)=>`<button class="rq-o ${v===i?'on':''}" data-s="${i}" ${ti}><span class="rq-mk">${v===i?ico('check'):''}</span>${l}</button>`).join('')}</div>`;
  else if(q.type==='slider')body=`<div class="rq-sl"><b>${v==null?50:v}</b><input type="range" min="0" max="100" value="${v==null?50:v}" data-sl ${ti} aria-label="Answer"><div class="rq-ends"><span>0</span><span>100</span></div></div>`;
  else if(q.type==='grid'){const g=v||{};body=`<div class="rq-grid">${q.rows.map((r,i)=>`<label class="rq-gr"><span>${esc(r)}</span><input type="range" min="1" max="10" value="${g[i]||5}" data-g="${i}" ${ti}><b>${g[i]||5}</b></label>`).join('')}</div>`;}
  else if(q.type==='sum'){const g=v||{},tot=q.opts.reduce((s,_,i)=>s+(+g[i]||0),0);body=`<p class="rq-hint">Split 100% across the items.</p><div class="rq-sum">${q.opts.map((o,i)=>`<label><span>${esc(o)}</span><input type="number" min="0" max="100" inputmode="numeric" placeholder="0" value="${g[i]==null?'':g[i]}" data-sum="${i}" ${ti}><i>%</i></label>`).join('')}<div class="rq-tot ${tot===100?'ok':''}" data-tot>Total ${tot}% of 100%</div></div>`;}
  else if(q.type==='number')body=`<input class="rq-in" type="number" inputmode="numeric" placeholder="Enter a number" value="${esc(v==null?'':v)}" data-open ${ti}>`;
  else if(q.type==='short')body=`<input class="rq-in" type="text" placeholder="Type your answer" value="${esc(v||'')}" data-open ${ti}>`;
  else if(q.type==='date')body=`<input class="rq-in" type="date" value="${esc(v||'')}" data-open ${ti}>`;

}
function improve(q){const t=q.text.replace(/\s+$/,'');if(!['single','multi','rank','scale','grid','open'].includes(q.type))return null;

  if(q.type==='grid')return /very poor/i.test(t)?null:`${t.replace(/\?$/,'')}, from 1 (very poor) to 10 (excellent)`;
  if(q.type==='open')return /few words/i.test(t)?null:`In a few words, ${lowerFirst(t)}`;
  if(q.type==='multi')return /all that apply/i.test(t)?null:`${t} Select all that apply.`;
  return /select one/i.test(t)?null:`${t} Select one answer.`;}

};
const RLANGS={},RLANG={},RREQ={};
const rlangs=id=>RLANGS[id]||(RLANGS[id]=id==='hp'?['EN','FR','DE','NL']:['EN','FR']);
function respondent(){
  const s=P(),c=PC[s.id],qs=allQ(s.id),rv=$('#rv');let st={i:-1,a:{},path:[],end:null};
  const T=()=>L10N[RLANG[s.id]||'EN'];
  const passes=q=>{const m=q.logic.match(/Show if (Q\d+) = (.+)/i);if(!m)return true;const src=qs.find(x=>x.no===m[1]);if(!src)return true;const v=st.a[src.no];return v!==undefined&&src.opts[v]===m[2].trim();};
  const screened=q=>{const m=q.logic.match(/Screen out if "(.+)"/i);return m&&q.opts[st.a[q.no]]===m[1];};
  const answered=q=>{const v=st.a[q.no];if(!q.req||q.type==='grid'||q.type==='slider')return true;
    if(['open','short','number','date'].includes(q.type))return !!(v!=null&&String(v).trim());

    return v!==undefined&&v!=='';};

    const t=T(),n=qs.length,pct=st.end?100:st.i<0?0:Math.round(st.i/n*100);

    if(st.end==='done')body=`<div class="rv-end">${ico('check','i big ok')}<h3>${t.thanks}</h3><p>${t.rec}</p></div>`,nav=`<button class="rv-btn ghost" data-rv="restart">${t.restart}</button>`;
    else if(st.end==='out')body=`<div class="rv-end">${ico('users','i big')}<h3>${t.out1}</h3><p>${t.out2}</p></div>`,nav=`<button class="rv-btn ghost" data-rv="restart">${t.restart}</button>`;
    else if(st.i<0)body=`<div class="rv-wel"><span class="ico ico-logo"></span><h3>${t.wel} ${c.cat}</h3><p>${t.about.replace('{n}',Math.round(n*.9))}</p></div>`,nav=`<button class="rv-btn" data-rv="next">${t.start} ${ico('arrow')}</button>`;

    rv.innerHTML=`<div class="rv-top"><span class="rv-brand"><span class="ico ico-logo"></span>${t.brand}</span><span class="rv-step">${st.i>=0&&!st.end?`${st.i+1} ${t.of} ${n}`:''}</span></div><div class="rv-pr"><i style="width:${pct}%"></i></div><div class="rv-body ${dir||''}">${body}</div><div class="rv-nav">${nav}</div>`;
    if(st.end==='done')burst($('.rv-end .ok'));
  };
  const go=d=>{
    if(d==='restart'){st={i:-1,a:{},path:[],end:null};draw('fwd');return;}
    if(d==='back'){if(st.path.length){st.i=st.path.pop();draw('back');}else{st.i=-1;draw('back');}return;}
    if(st.i>=0){const q=qs[st.i];if(!answered(q)){const b=$('.rv-body',rv);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#rvErr').hidden=false;return;}
      if(screened(q)){st.end='out';draw('fwd');return;}}

    const r=e.target.closest('[data-r]');if(r){const i=+r.dataset.r,a=st.a[q.no]||[];st.a[q.no]=a.includes(i)?a.filter(x=>x!==i):a.length<rankNeed(q)?[...a,i]:a;draw();return;}
    const md=e.target.closest('[data-md]');if(md){const k=md.dataset.md[0],i=+md.dataset.md.slice(1),g={...(st.a[q.no]||{})};g[k]=i;const o2=k==='b'?'w':'b';if(g[o2]===i)delete g[o2];st.a[q.no]=g;draw();return;}
    const mx=e.target.closest('[data-mx]');if(mx){const [ri,ci]=mx.dataset.mx.split(':').map(Number),g={...(st.a[q.no]||{})};if(q.type==='mmulti'){const a=g[ri]||[];g[ri]=a.includes(ci)?a.filter(x=>x!==ci):[...a,ci];}else g[ri]=ci;st.a[q.no]=g;draw();return;}
    const sc=e.target.closest('[data-s]');if(sc){st.a[q.no]=+sc.dataset.s;draw();}};
  rv.oninput=e=>{if(st.i<0)return;const q=qs[st.i],d=e.target.dataset;
    if(d.g!==undefined){const g=st.a[q.no]||{};g[d.g]=+e.target.value;st.a[q.no]=g;e.target.nextElementSibling.textContent=e.target.value;}
    if(d.open!==undefined)st.a[q.no]=e.target.value;
    if(d.sl!==undefined){st.a[q.no]=+e.target.value;e.target.previousElementSibling.textContent=e.target.value;}
    if(d.dd!==undefined)st.a[q.no]=e.target.value===''?undefined:+e.target.value;

  ];}
let sel=0,list=[];
function drawCmd(q=''){
  const all=cmds(),v=q.toLowerCase();list=all.filter(c=>(c.l+' '+c.g+' '+c.k).toLowerCase().includes(v));sel=Math.min(sel,Math.max(0,list.length-1));
  let g='';$('#cmdkList').innerHTML=list.map((c,i)=>{const h=c.g!==g?`<li class="cg">${c.g}</li>`:'';g=c.g;return h+`<li><button class="${i===sel?'sel':''}" data-cmd="${i}">${ico(c.ic)}${esc(c.l)}<small>${c.k}</small></button></li>`;}).join('')||'<li class="cg" style="padding:14px">No match. Try “deck”, “quotas” or a project name.</li>';
  $('#cmdkList .sel')?.scrollIntoView({block:'nearest'});}
function openCmd(){$('#cmdk').classList.add('open');$('#cmdkIn').value='';sel=0;drawCmd();$('#cmdkIn').focus();}
function closeCmd(){$('#cmdk').classList.remove('open');}
function runCmd(i){const c=list[i];closeCmd();if(c)c.run();}
$('#jump').addEventListener('click',openCmd);
$('#cmdk').addEventListener('click',e=>{if(e.target.id==='cmdk')closeCmd();const b=e.target.closest('[data-cmd]');if(b)runCmd(+b.dataset.cmd);});
$('#cmdkIn').addEventListener('input',e=>{sel=0;drawCmd(e.target.value);});
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmdk').classList.contains('open')?closeCmd():openCmd();return;}
  if(e.key==='Escape'){closePicker();closeModal();}
  if(deck.pkeys)deck.pkeys(e);
  if(!$('#cmdk').classList.contains('open')){if(deck.keys&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))deck.keys(e);return;}
  if(e.key==='Escape')closeCmd();
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(list.length-1,sel+1);drawCmd($('#cmdkIn').value);}
  if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);drawCmd($('#cmdkIn').value);}
  if(e.key==='Enter'){e.preventDefault();runCmd(sel);}
});

<script>
