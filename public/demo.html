.skip{position:absolute;left:-999px;top:8px;background:var(--paper);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* ================= APP SHELL ================= */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh;transition:grid-template-columns .35s var(--ease)}
.app.collapsed{--side:76px}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--paper);border-right:1px solid var(--line);padding:14px 12px 12px;overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand .ico-logo{width:32px;height:32px}
.brand-txt{line-height:1.15;white-space:nowrap}
.brand-txt b{display:block;font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:16px}
.brand-txt span{font-size:11.5px;color:var(--muted)}
.collapse{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.collapse:hover{background:var(--bg);color:var(--ink)}
.collapse svg{transition:transform .35s var(--ease)}
.app.collapsed .collapse svg{transform:rotate(180deg)}

.jump{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;color:var(--faint);font-size:13px;background:var(--paper-2);margin-bottom:14px;white-space:nowrap}
.jump:hover{border-color:var(--accent-line);color:var(--muted)}
.jump kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--paper);color:var(--muted)}

.navlabel{font-size:11.5px;font-weight:600;color:var(--faint);padding:6px 10px 6px;white-space:nowrap}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav-item{position:relative}
.nav-btn{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .18s,color .18s}
.nav-btn:hover{background:var(--bg)}
.nav-btn .i{color:var(--muted);transition:color .18s}
.nav-btn .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.nav-btn .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.nav-btn .chev{margin-left:6px;width:14px;height:14px;color:var(--faint);transition:transform .3s var(--ease)}
.nav-btn .badge+.chev,.nav-btn .live+.chev{margin-left:8px}
.nav-btn .sp{margin-left:auto}
.nav-item.open>.nav-btn .chev{transform:rotate(90deg)}
.nav-item.active>.nav-btn{background:var(--accent-soft);color:var(--accent-deep)}
.nav-item.active>.nav-btn .i{color:var(--accent)}
.nav-item.active>.nav-btn .badge{background:var(--paper);color:var(--accent-deep)}

/* tree children: the angled connector */
.subnav{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.nav-item.open>.subnav{grid-template-rows:1fr}
.subnav>ul{overflow:hidden;list-style:none;margin:0;padding:0 0 0 30px;position:relative}
.subnav li{position:relative}
.subnav li::before{content:"";position:absolute;left:-11px;top:0;height:100%;border-left:1.5px solid var(--line)}
.subnav li:last-child::before{height:17px}
.subnav li::after{content:"";position:absolute;left:-11px;top:6px;width:10px;height:11px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:8px}
.subnav li:first-child{margin-top:2px}
.subnav a{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:1px 0;border-radius:8px;font-size:13px;color:var(--muted);white-space:nowrap;transition:background .18s,color .18s}
.subnav a:hover{color:var(--ink);background:var(--bg)}
.subnav a .n{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.subnav a[aria-current]{color:var(--accent-deep);font-weight:600;background:transparent}
.subnav li:has(a[aria-current])::after{border-color:var(--accent)}
.nav-item.open .subnav li{opacity:0;transform:translateX(-6px);animation:subIn .35s var(--ease) forwards;animation-delay:calc(var(--k)*40ms + 60ms)}
@keyframes subIn{to{opacity:1;transform:none}}

.side-foot{margin-top:auto;display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 2px;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.me b{display:block;font-size:13px;line-height:1.2}.me span{font-size:11.5px;color:var(--muted)}

/* collapsed rail */
.app.collapsed .brand-txt,.app.collapsed .jump span,.app.collapsed .jump kbd,.app.collapsed .navlabel,.app.collapsed .nav-btn>span:not(.live),.app.collapsed .nav-btn .chev,.app.collapsed .nav-btn .badge,.app.collapsed .me>div,.app.collapsed .subnav{display:none}
.app.collapsed .brand{flex-direction:column;gap:8px}
.app.collapsed .collapse{margin-left:0}
.app.collapsed .jump{justify-content:center;padding:8px}
.app.collapsed .nav-btn{justify-content:center;padding:10px}
.app.collapsed .nav-btn .live{position:absolute;right:12px;top:10px;margin:0}
.app.collapsed .me{justify-content:center;padding:10px 0 2px}

/* ---------- main ---------- */
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 32px;background:var(--topbar);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.menu{display:none;width:34px;height:34px;border-radius:9px;place-items:center;border:1px solid var(--line);background:var(--paper)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs svg{width:14px;height:14px;color:var(--faint)}
.project{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:12.5px;font-weight:500;white-space:nowrap}
.project[hidden]{display:none}
.project .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}
.btn .i{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(36,92,244,.8)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{border:1px solid var(--line);background:var(--paper)}
.btn-ghost:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn-ai{border:1px solid var(--accent-line);background:linear-gradient(var(--paper),var(--accent-soft2));color:var(--accent-deep)}
.btn-ai:hover{box-shadow:0 0 0 4px var(--accent-soft)}

.page{max-width:1240px;margin:0 auto;padding:26px 32px 80px}
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.page-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px}
.page-head .hello{font-size:13px;color:var(--muted);margin:0 0 4px}
.page-head h1{font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1;margin:0}
.page-head p.lead{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:620px}
.page-head .actions{margin-left:auto;display:flex;gap:10px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
.card-h h2{margin:0;font-size:15px;font-weight:600}
.card-h .meta{font-size:12.5px;color:var(--muted)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 20px 18px}
.alink{color:var(--accent-deep);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.alink:hover{text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.live{background:var(--ok-soft);color:var(--ok)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.draft{background:var(--soft);color:var(--muted)}
.chip.analysis{background:var(--accent-soft);color:var(--accent-deep)}
.chip.closed{background:var(--soft);color:var(--ink-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.section-anchor{scroll-margin-top:80px}

/* pipeline strip: the signature element */
.pipeline{display:grid;grid-template-columns:repeat(5,1fr);position:relative;padding:18px 8px 16px}
.pipeline::before{content:"";position:absolute;left:10%;right:10%;top:38px;height:2px;background:linear-gradient(90deg,var(--accent) 0 62%,var(--line) 62%)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 8px;border-radius:12px}
.stage .node{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line);color:var(--muted);position:relative;z-index:1;transition:transform .25s var(--ease),border-color .2s,box-shadow .2s}
.stage.has .node{border-color:var(--accent-line);color:var(--accent)}
.stage.hot .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 10px 20px -10px rgba(36,92,244,.9)}
.stage .count{position:absolute;top:-7px;right:-9px;min-width:20px;height:20px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper)}
.stage b{font-size:13px}
.stage span{font-size:12px;color:var(--muted);line-height:1.35}
.stage:hover .node{transform:translateY(-2px)}

.attn{list-style:none;margin:0;padding:0}
.attn li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.attn li:first-child{border-top:0;padding-top:4px}
.attn .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.attn .ic.w{background:var(--warn-soft);color:var(--warn)}
.attn .ic.g{background:var(--ok-soft);color:var(--ok)}
.attn b{display:block;font-size:13.5px;font-weight:600}
.attn small{font-size:12.5px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line-2);margin-top:12px}
.stat{padding:14px 20px;border-left:1px solid var(--line-2)}
.stat:first-child{border-left:0}
.stat small{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:DedaleGeneral,DedaleInter,sans-serif;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr{transition:background .15s}
.t tbody tr:hover{background:var(--hover)}
.t .name{min-width:230px;display:flex;align-items:center;gap:12px}
.t .name .fi{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.t .name b{display:block;font-weight:600;font-size:13.5px}
.t .name small{font-size:12px;color:var(--muted)}
.pgr{display:flex;align-items:center;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.pgr .bar{flex:1;min-width:70px;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.pgr .bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.team{display:flex}
.team span{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);margin-left:-6px;font-size:9.5px;font-weight:700;display:grid;place-items:center;color:#fff}
.team span:first-child{margin-left:0}

.feed{list-style:none;margin:0;padding:0;position:relative}
.feed::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;border-left:1.5px solid var(--line)}
.feed li{position:relative;padding:0 0 14px 26px;font-size:13px}
.feed li::before{content:"";position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--accent-line)}
.feed li:first-child::before{border-color:var(--accent);background:var(--accent)}
.feed b{font-weight:600}
.feed small{display:block;color:var(--faint);font-size:12px}
/* live project banner */
.lp-h{display:flex;align-items:center;gap:16px;padding:18px 22px 0;flex-wrap:wrap}
.lp-ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lp-ttl h2{margin:0;font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em}
.lp-h .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.lp-live{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:600}
.lp-live i,.lp-tag i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:lp-beat 1.8s infinite}
@keyframes lp-beat{0%{box-shadow:0 0 0 0 rgba(46,125,91,.55)}70%{box-shadow:0 0 0 7px rgba(46,125,91,0)}100%{box-shadow:0 0 0 0 rgba(46,125,91,0)}}
.lp-track{position:relative;padding:14px 8px 18px}
.lp-in{position:relative}
.lp-base{position:absolute;left:10%;right:10%;top:35px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.lp-done{position:absolute;left:10%;width:40%;top:34px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#5b8cff);overflow:hidden}
.lp-done::after{content:"";position:absolute;top:0;bottom:0;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:lp-shim 2.8s ease-in-out infinite}
@keyframes lp-shim{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
.lp-cur{position:absolute;left:50%;width:calc(20% * var(--p,0));top:34px;height:4px;border-radius:2px;background:linear-gradient(90deg,#5b8cff,var(--accent));transition:width .9s var(--ease)}
.lp-cur::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2.5px solid var(--accent);box-shadow:0 0 0 4px rgba(36,92,244,.15)}
.lp-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative;z-index:1}
.lp-step a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:12px 10px 14px;border-radius:16px;transition:background .2s}
.lp-step a:hover{background:var(--line-2)}
.lp-step.now a{background:linear-gradient(180deg,var(--accent-soft),transparent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.lp-node{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line);color:var(--faint);transition:transform .25s var(--ease)}
.lp-step a:hover .lp-node{transform:translateY(-2px)}
.lp-step.done .lp-node{background:var(--accent);border-color:var(--accent);color:#fff;border-radius:50%}
.lp-step.done .lp-node svg{stroke-width:2.6}
.lp-step.now .lp-node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 12px 24px -10px rgba(36,92,244,.9)}
.lp-step.next .lp-node{border-style:dashed;background:var(--paper)}
.lp-ring{position:absolute;inset:-2px;border-radius:16px;border:2px solid var(--accent);opacity:0;animation:lp-ring 2.4s ease-out infinite}
.lp-ring.r2{animation-delay:1.2s}
@keyframes lp-ring{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(1.65)}}
.lp-step b{font-size:13.5px;margin-top:4px}
.lp-step.next b{color:var(--ink-2)}
.lp-d{font-size:12px;color:var(--muted);line-height:1.35}
.lp-d b{font-size:12px;margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.lp-tag{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.lp-step.done .lp-tag{background:var(--accent-soft);color:var(--accent-deep)}
.lp-step.now .lp-tag{background:var(--ok-soft);color:var(--ok)}
.lp-tag i{width:6px;height:6px}
.lp-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 18px 0}
.lp-rail span{position:relative;height:5px;border-radius:2px;background:var(--line-2);overflow:hidden}
.lp-rail .done{background:var(--accent)}
.lp-rail .now{background:var(--accent-soft);box-shadow:0 0 12px -2px rgba(36,92,244,.45)}
.lp-rail .now i{position:absolute;top:0;bottom:0;width:36%;border-radius:2px;background:linear-gradient(90deg,rgba(36,92,244,0),var(--accent) 50%,rgba(36,92,244,0));animation:lp-sweep 1.7s ease-in-out infinite alternate}
@keyframes lp-sweep{from{left:-12%}to{left:76%}}
.lp-stats{margin-top:4px}
.lp-stats .stat b{display:flex;align-items:baseline;gap:4px}
.lp-stats .stat b span{font-size:inherit;color:inherit;line-height:inherit}
.lp-stats .stat>span{display:block}
.lp-stats .stat b small{display:inline;font-family:DedaleInter,Inter,Arial,sans-serif;font-size:13px;font-weight:500;color:var(--faint)}
.lp-plus{font-style:normal;font-family:DedaleInter,Inter,Arial,sans-serif;font-size:12px;font-weight:700;color:var(--ok);opacity:0;margin-left:4px}
.lp-plus.pop{animation:lp-pop 1.4s ease-out}
@keyframes lp-pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.lp-num.flash{animation:lp-flash 1s ease-out}
@keyframes lp-flash{0%{color:var(--ok)}100%{color:var(--ink)}}
.lp-mini{display:block;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin:6px 0 5px;max-width:200px}
.lp-mini i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .9s var(--ease)}
@media (max-width:900px){.lp-track{overflow-x:auto}.lp-in,.lp-rail{min-width:640px}.lp-h .right .btn{display:none}}

.seg{display:inline-flex;padding:3px;background:var(--soft);border-radius:10px;gap:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(21,36,64,.12)}
.seg button .n{font-size:11px;color:var(--faint);margin-left:4px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:7px 12px;color:var(--faint);min-width:220px}
.search input{border:0;outline:0;font:inherit;color:var(--ink);width:100%;background:none}

.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tpl{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--paper);transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.tpl:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow)}
.tpl .ico{width:30px;height:30px;margin-bottom:10px}
.tpl b{display:block;font-size:13.5px}.tpl small{color:var(--muted);font-size:12.5px}

/* scoping */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}
.mail-list{list-style:none;margin:0;padding:6px}
.mail-list li button{display:block;width:100%;text-align:left;padding:12px;border-radius:12px}
.mail-list li button[aria-current]{background:var(--accent-soft)}
.mail-list b{display:block;font-size:13.5px}
.mail-list small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-list .when{float:right;font-size:11.5px;color:var(--faint)}
.brief-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.brief-item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--paper-2)}
.brief-item small{display:block;font-size:11.5px;color:var(--muted)}
.brief-item b{font-weight:500;font-size:13.5px}
.att{display:inline-flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.att .ico{width:28px;height:28px}
.att b{display:block;font-size:13px}.att small{font-size:12px;color:var(--muted)}

/* fieldwork */
.quota-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qcard{padding:16px 18px}
.qcard small{font-size:12px;color:var(--muted)}
.qcard b{display:block;font-family:DedaleGeneral,DedaleInter,sans-serif;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.qcard .bar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;margin-top:8px}
.qcard .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:200px 1fr 64px;gap:12px;align-items:center;font-size:13px}
.hbar .tr{height:10px;border-radius:5px;background:var(--line-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;background:var(--accent);transform-origin:left;animation:grow .9s var(--ease) both}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbar .v small{color:var(--faint);font-weight:400}
@keyframes grow{from{transform:scaleX(0)}}

/* analysis */
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);margin-bottom:18px}
.filters .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.filters .n{margin-left:auto;font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:DedaleGeneral,DedaleInter,sans-serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi b em{font-style:normal;font-size:14px;color:var(--faint);font-weight:500}
.kpi span{font-size:12px;color:var(--muted)}
.heat{width:100%;border-collapse:separate;border-spacing:3px;font-size:12.5px}
.heat th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:4px 6px;white-space:nowrap}
.heat th:first-child{text-align:left}
.heat td{text-align:center;padding:9px 6px;border-radius:7px;font-variant-numeric:tabular-nums;font-weight:600}
.heat td:first-child{text-align:left;font-weight:500;background:none;padding-left:0;white-space:nowrap}
.vcols{display:flex;align-items:flex-end;gap:18px;height:170px;padding:10px 6px 0}
.vcols div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.vcols i{display:block;border-radius:8px 8px 0 0;background:var(--accent-line);margin:0 auto 6px;width:70%;transform-origin:bottom;animation:growY .9s var(--ease) both}
.vcols div:nth-child(2) i{background:var(--accent)}.vcols div:nth-child(3) i{background:#7f9fe8}
.vcols b{display:block;color:var(--ink);font-size:14px}
@keyframes growY{from{transform:scaleY(0)}}
.note{font-size:12px;color:var(--faint);margin-top:10px}
.heat.eq{table-layout:fixed;min-width:640px}
.heat.eq th{white-space:normal;line-height:1.25;vertical-align:bottom}
.heat.eq td{height:40px;padding:0 6px}
.heat.eq td:first-child{white-space:normal;line-height:1.3}
.t .alink,.pgr{white-space:nowrap}
.illus{display:flex;align-items:center;gap:8px;margin:18px 2px 0;font-size:12.5px;color:var(--faint)}
.illus svg{width:15px;height:15px}
.mail-list .unread{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle}
.qe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.qe-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.qe-row:first-child{border-top:0}
.qe-l b{display:block;font-size:13.5px;font-weight:600}
.qe-l small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qe-row.met .qe-l small{color:var(--ok);font-weight:600}
.qe-in{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint)}
.qe-in input{width:68px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;text-align:right;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--paper-2);font-variant-numeric:tabular-nums;transition:border-color .2s,box-shadow .2s}
.qe-in input:hover{border-color:var(--accent-line)}
.qe-in input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--paper)}
.qe-bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--line-2);overflow:hidden}
.qe-bar i{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .5s var(--ease)}
.qe-row.met .qe-bar i{background:var(--ok)}
.qe-foot{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.qe-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:1180px){.qe-grid{grid-template-columns:1fr}}

/* copilot */
.copilot{display:flex;flex-direction:column;height:560px}
.chat-body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.ai .acts{display:flex;gap:8px;margin-top:10px}
.mini-chart{margin-top:10px;display:grid;gap:6px}
.chat-in{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.chat-in input{flex:1;border:1px solid var(--accent-line);border-radius:12px;padding:10px 14px;font:inherit;outline:0}
.chat-in input:focus{box-shadow:0 0 0 4px var(--accent-soft)}
.prompts{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.prompts button{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);background:var(--paper)}
.prompts button:hover{border-color:var(--accent-line);color:var(--accent-deep)}

/* reports */
.slides{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.sl{border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;transition:opacity .3s,filter .3s,border-color .3s}
.sl.dropped{opacity:.45;filter:grayscale(1)}
.sl.kept{border-color:var(--ok)}
.sl-canvas{aspect-ratio:16/9;padding:16px 18px;display:flex;flex-direction:column;border-bottom:1px solid var(--line-2);background:linear-gradient(#fff,#fbfcff)}
.sl-canvas .top{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.sl-canvas .top .ico{width:13px;height:13px}
.sl-canvas h3{font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:15px;line-height:1.25;margin:8px 0 10px}
.sl-canvas .src{margin-top:auto;font-size:9.5px;color:var(--faint)}
.sl-foot{display:flex;align-items:center;gap:8px;padding:10px 14px}
.sl-foot .why{font-size:12px;color:var(--muted);flex:1}
.sl-foot button{padding:6px 14px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--paper)}
.sl-foot .k[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sl-foot .d[aria-pressed="true"]{background:var(--del-soft);border-color:var(--del);color:var(--del)}
.mini-h{display:grid;gap:5px}
.mini-h div{display:grid;grid-template-columns:118px 1fr 30px;gap:8px;align-items:center;font-size:10.5px}
.mini-h .tr{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.mini-h .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.mini-h .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.export{display:grid;gap:8px}
.export button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;text-align:left;background:var(--paper);transition:border-color .2s,background .2s}
.export button:hover{border-color:var(--accent-line);background:var(--hover)}
.export .ico{width:28px;height:28px}
.export .fmt{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.export b{display:block;font-size:13px}.export small{font-size:12px;color:var(--muted)}


/* how it works: steps list + animated panel (hw- prefix, scoped to .hiw) */
.hiw{--canvas:var(--paper-2);--track:var(--line-2);--dot:var(--dotc);--violet:#7a5af8;--cyan:#36c2f4;
  --shadow-up:0 2px 4px rgba(21,36,64,.05),0 24px 48px -28px rgba(21,36,64,.45);
  margin-top:34px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px;
  display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:32px;align-items:stretch}
.hiw h2{margin:0 0 6px;font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:24px;letter-spacing:-.01em}
.hiw .hw-sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.hw-list{display:flex;flex-direction:column;gap:4px;list-style:none;margin:0;padding:0}
.hw-it{position:relative;display:grid;grid-template-columns:30px 1fr;gap:12px;width:100%;padding:12px 14px 14px;border-radius:14px;text-align:left;transition:background .3s}
.hw-it:hover{background:var(--line-2)}
.hw-it.on{background:var(--accent-soft)}
.hw-it .hw-n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--paper);transition:all .3s}
.hw-it.on .hw-n{background:var(--accent);border-color:var(--accent);color:#fff}
.hw-it b{display:block;font-size:15px;line-height:30px;font-weight:600}
.hw-it p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,opacity .35s ease}
.hw-it.on p{max-height:110px;opacity:1;margin-top:2px}
.hw-it .hw-pr{position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:1px;overflow:hidden}
.hw-it.on .hw-pr{background:var(--accent-line)}
.hw-it .hw-pr i{display:block;height:100%;width:0;background:var(--accent)}

.hw-panel{position:relative;min-height:440px;background:var(--canvas);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hw-panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:20px 20px}
.hw-ph{position:relative;display:flex;align-items:center;gap:10px;padding:16px 20px 0}
.hw-ph b{font-size:13px}
.hw-ph span{font-size:12.5px;color:var(--muted)}
.hw-segs{display:flex;gap:6px;margin-left:auto}
.hw-segs i{display:block;width:26px;height:4px;border-radius:2px;background:var(--track);overflow:hidden;position:relative}
.hw-segs i em{position:absolute;inset:0;width:0;background:var(--accent);border-radius:2px}
.hw-vbox{position:absolute;left:0;right:0;top:44px;bottom:0}
.hw-vis{position:absolute;left:0;top:0;width:460px;height:340px;transform-origin:0 0;opacity:0;transition:opacity .45s ease;font-size:13px;line-height:1.35;color:var(--ink)}
.hw-vis.on{opacity:1}
.hw-vis .ico{display:inline-block;background-position:center;background-size:contain;background-repeat:no-repeat}

/* atoms */
.hw-card{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-up)}
.hw-lbl{font-size:11px;color:var(--faint)}
.hw-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-deep);white-space:nowrap}
.hw-chip.ok{background:var(--ok-soft);color:var(--ok)}
.hw-chip svg,.hw-spark{width:13px;height:13px;fill:currentColor;flex-shrink:0}
.hw-av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:9.5px;font-weight:700;flex-shrink:0}
.hw-track{height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.hw-track i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px}
.hw-input{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 12px;font-size:12.5px}
.hw-input .hw-spark{color:var(--accent);width:14px;height:14px}
.hw-input .hw-ph2{flex:1;white-space:nowrap;overflow:hidden;color:var(--ink)}
.hw-input .hw-ph2:empty::before{content:attr(data-empty);color:var(--faint)}
.hw-go{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex-shrink:0;transition:transform .15s,background .15s}
.hw-go svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hw-go.press{transform:scale(.88);background:var(--accent-deep)}

/* 1 scope */
.hw-dz{position:absolute;left:60px;top:18px;width:340px;height:118px;border:1.5px dashed var(--accent-line);border-radius:16px;display:grid;place-items:center;color:var(--faint);font-size:13px;transition:border-color .3s,background .3s}
.hw-dz.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.hw-dz span{transition:opacity .3s}
.hw-file{left:110px;top:48px;width:240px;height:58px;display:flex;align-items:center;gap:12px;padding:0 14px}
.hw-file .ico{width:30px;height:30px}
.hw-file b{display:block;font-size:12.5px;white-space:nowrap}
.hw-beam{position:absolute;left:229px;top:137px;width:2px;height:58px;background:linear-gradient(180deg,var(--accent),var(--violet));transform-origin:50% 0;border-radius:1px}
.hw-beam::after{content:"";position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--paper);box-shadow:0 0 10px 3px rgba(122,90,248,.7);top:var(--y,0)}
.hw-ai{position:absolute;left:30px;top:194px;width:400px;height:112px;border-radius:20px;padding:2px;overflow:hidden;
  box-shadow:0 18px 50px -18px rgba(122,90,248,.55),0 10px 30px -18px rgba(36,92,244,.6)}
.hw-ai::before{content:"";position:absolute;left:50%;top:50%;width:620px;height:620px;margin:-310px 0 0 -310px;
  background:conic-gradient(from 0deg,var(--accent),var(--violet),var(--cyan),var(--accent));animation:hw-spin 4.5s linear infinite}
@keyframes hw-spin{to{transform:rotate(360deg)}}
.hw-ai-in{position:relative;height:100%;border-radius:18px;background:var(--paper);display:flex;align-items:center;gap:16px;padding:0 20px;overflow:hidden}
.hw-ai-in::after{content:"";position:absolute;inset:0;background:radial-gradient(240px 120px at 0% 50%,rgba(122,90,248,.12),transparent 70%),radial-gradient(220px 120px at 100% 50%,rgba(54,194,244,.1),transparent 70%);pointer-events:none}
.hw-orb{position:relative;width:54px;height:54px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,#fff 0,#b8c9ff 18%,var(--accent) 52%,var(--violet) 100%);box-shadow:0 0 0 6px rgba(122,90,248,.1),0 8px 24px -6px rgba(122,90,248,.8);animation:hw-breathe 2.4s ease-in-out infinite}
.hw-orb svg{width:24px;height:24px;fill:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
@keyframes hw-breathe{50%{box-shadow:0 0 0 11px rgba(122,90,248,.06),0 8px 30px -4px rgba(122,90,248,.9)}}
.hw-ai-t{position:relative;z-index:1}
.hw-ai-t b{display:block;font-family:DedaleGeneral,DedaleInter,sans-serif;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;
  background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 35%,var(--accent) 50%,var(--violet) 58%,var(--ink) 72%,var(--ink) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hw-shine 3.2s linear infinite}
@keyframes hw-shine{from{background-position:100% 0}to{background-position:-150% 0}}
.hw-ai-t span{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.hw-ai-t span i{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px rgba(122,90,248,.18)}
.hw-ai-t span.done i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

/* 2 questionnaire */
.hw-doc{left:22px;top:14px;width:244px;height:300px;overflow:hidden}
.hw-doc .hw-hd{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:12.5px}
.hw-doc .hw-hd .ico{width:18px;height:18px}
.hw-doc .hw-hd .hw-chip{margin-left:auto;height:22px;font-size:11px;transition:background .3s,color .3s}
.hw-doc .hw-hd .hw-chip.flash{background:var(--accent);color:#fff}
.hw-ql{padding:8px 14px}
.hw-qr{display:flex;align-items:center;gap:10px;height:38px;border-bottom:1px solid var(--line-2);overflow:hidden}
.hw-qr em{font-style:normal;font-size:11px;font-weight:600;color:var(--faint);width:22px}
.hw-qr i{display:block;height:8px;border-radius:4px;background:var(--line);transform-origin:0 50%}
.hw-qr.new{background:var(--ok-soft);border-radius:8px;border-bottom:0;padding:0 8px;margin:0 -8px}
.hw-qr.new i{background:#9fd3bd}
.hw-bub{left:246px;width:196px;padding:11px 12px}
.hw-bub .hw-who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:5px}
.hw-bub .hw-who span{color:var(--faint);font-weight:500}
.hw-bub p{display:block;margin:0;font-size:12.5px;color:var(--ink-2)}
.hw-bub.hw-me{border-color:var(--accent-line)}
.hw-typing{display:flex;gap:4px;padding:3px 0}
.hw-typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:hw-dot 1s infinite ease-in-out}
.hw-typing i:nth-child(2){animation-delay:.15s}.hw-typing i:nth-child(3){animation-delay:.3s}
@keyframes hw-dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.hw-val{left:246px;top:262px;width:196px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-color:transparent}
.hw-val .hw-ck{width:26px;height:26px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex-shrink:0}
.hw-val .hw-ck svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hw-val b{font-size:12.5px;color:var(--ok)}

/* 3 fieldwork */
.hw-lnk{left:80px;top:10px;width:300px;height:42px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;font-size:12.5px;color:var(--ink-2)}
.hw-lnk svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round}
.hw-lnk .hw-cp{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border-radius:7px;padding:5px 9px}
.hw-ring{position:absolute;left:18px;top:86px;width:140px;height:140px}
.hw-ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.hw-ring .hw-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.hw-ring .hw-num b{display:block;font-family:DedaleGeneral,DedaleInter,sans-serif;font-size:34px;line-height:1}
.hw-ring .hw-num span{font-size:11.5px;color:var(--faint)}
.hw-met{position:absolute;left:30px;top:244px}
.hw-quo{left:172px;top:66px;width:276px;padding:12px 14px 6px}
.hw-qg{font-size:10.5px;font-weight:600;color:var(--accent-deep);margin:0 0 4px}
.hw-qg:not(:first-child){margin-top:9px}
.hw-qrow{display:grid;grid-template-columns:92px 1fr 62px;gap:8px;align-items:center;height:19px;font-size:11.5px;white-space:nowrap}
.hw-qrow .hw-track{height:6px}
.hw-qrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hw-qrow.full span:last-child{color:var(--ok);font-weight:600}
.hw-qrow.full .hw-track i{background:var(--ok)}
.hw-pt{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0}

/* 4 analysis */
.hw-tbl{left:18px;top:8px;width:424px;padding:12px 14px 8px}
.hw-tbl h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px}
.hw-tbl h4 .hw-chip{margin-left:auto;height:22px;font-size:10.5px}
.hw-tr{display:grid;grid-template-columns:118px 1fr 52px 52px;gap:10px;align-items:center;height:28px;font-size:12px;border-top:1px solid var(--line-2)}
.hw-tr.h{font-size:10.5px;color:var(--faint);font-weight:600;border-top:0;height:20px}
.hw-tr .c{text-align:right;font-variant-numeric:tabular-nums}
.hw-tr .c.hw-hi{color:var(--accent-deep);font-weight:700}
.hw-sh{display:flex;align-items:center;gap:8px}
.hw-sh .hw-track{flex:1}
.hw-sh em{font-style:normal;font-weight:600;width:30px;text-align:right;font-variant-numeric:tabular-nums}
.hw-ask{left:18px;top:210px;width:424px}
.hw-ans{left:18px;top:262px;width:424px;padding:11px 14px;display:flex;gap:10px;align-items:center;border-color:var(--accent-line)}
.hw-ans .hw-sq{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--violet));display:grid;place-items:center;flex-shrink:0}
.hw-ans .hw-sq svg{width:14px;height:14px;fill:#fff}
.hw-ans p{margin:0;font-size:12.5px;color:var(--ink-2)}
.hw-ans p b{color:var(--ink)}

/* 5 slides */
.hw-top{position:absolute;left:18px;top:8px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.hw-sl{position:absolute;top:40px;width:100px;height:56px;background:#fff;border:1px solid #e2e8f1;border-radius:5px;padding:6px 7px;box-shadow:var(--shadow-up);transition:box-shadow .3s}
.hw-sl i{display:block;height:4px;border-radius:2px;background:#245cf4;margin-top:4px}
.hw-sl i.t{height:5px;background:#152440;width:80%;margin:0 0 6px}
.hw-sl.ok{box-shadow:0 0 0 2px var(--ok),var(--shadow-up)}
.hw-sl .hw-badge{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.34,1.45,.64,1)}
.hw-sl .hw-badge svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hw-sl.ok .hw-badge{opacity:1;transform:scale(1)}
.hw-sl.new{border-color:var(--violet)}
.hw-sl .hw-newtag{position:absolute;left:6px;bottom:-9px;font-size:9px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:5px;padding:1px 6px}
.hw-slot{position:absolute;top:40px;width:100px;height:56px;border:1.5px dashed var(--accent-line);border-radius:5px}
.hw-ask2{left:18px;top:122px;width:424px}
.hw-pf{left:40px;top:196px;width:380px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.hw-pf .ico{width:36px;height:36px}
.hw-pf .hw-mid{flex:1;min-width:0}
.hw-pf b{display:block;font-size:13px;margin-bottom:7px}
.hw-pf .hw-dl{height:30px;padding:0 12px;border-radius:9px;background:var(--line-2);color:var(--faint);font-weight:600;font-size:12px;display:grid;place-items:center;transition:background .3s,color .3s}
.hw-pf .hw-dl.on{background:var(--accent);color:#fff}

@media (max-width:900px){.hiw{grid-template-columns:1fr;padding:18px}.hw-panel{min-height:0;aspect-ratio:4/3}.hw-ph b{white-space:nowrap}.hw-ph span{display:none}}


/* command palette */
.cmdk{position:fixed;inset:0;z-index:80;display:none;place-items:start center;padding-top:12vh;background:rgba(21,36,64,.28);backdrop-filter:blur(3px)}
.cmdk.open{display:grid;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.cmdk-box{width:min(560px,92vw);background:var(--paper);border-radius:16px;box-shadow:0 40px 80px -30px rgba(21,36,64,.5);overflow:hidden;animation:pop .28s var(--ease)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.cmdk-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:15px;outline:0}
.cmdk-box ul{list-style:none;margin:0;padding:8px;max-height:340px;overflow:auto}
.cmdk-box li button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-size:13.5px}
.cmdk-box li button small{margin-left:auto;color:var(--faint);font-size:12px}
.cmdk-box li button.sel,.cmdk-box li button:hover{background:var(--accent-soft);color:var(--accent-deep)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;transition:all .3s var(--ease);z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:1100px){
  .g-main{grid-template-columns:1fr}
  .tpl-grid,.quota-grid,.kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);transition:transform .35s var(--ease);box-shadow:20px 0 60px -30px rgba(21,36,64,.5)}
  .app.drawer .side{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(21,36,64,.25);z-index:25}
  .collapse{display:none}
  .menu{display:grid}
  .topbar{padding:10px 16px}
  .page{padding:20px 16px 60px}
  .project,.top-actions .btn-ghost,.top-actions .btn-ai{display:none}
  .crumbs>span,.crumbs>svg{display:none}
  .split,.slides{grid-template-columns:1fr}
  .pipeline{grid-template-columns:repeat(5,minmax(96px,1fr));overflow-x:auto}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:0}
  .hbar{grid-template-columns:120px 1fr 54px}
  .page-head{flex-wrap:wrap}
  .page-head .actions{margin-left:0}
  .t .hide-m{display:none}
