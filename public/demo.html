/* ================= v3 additions ================= */
:root[data-theme="dark"]{
  --ink:#e7ecf6;--ink-2:#c9d2e3;--muted:#97a5bd;--faint:#71809a;--line:#26324b;--line-2:#1c273e;
  --bg:#0b1222;--paper:#121b2e;--paper-2:#152036;--soft:#1b263d;--hover:#17223a;--topbar:rgba(11,18,34,.82);
  --accent:#4c7dff;--accent-deep:#9ab8ff;--accent-soft:#18284c;--accent-soft2:#16233f;--accent-line:#2f4a8a;
  --ok:#4cc38a;--ok-soft:#133429;--warn:#e3a24a;--warn-soft:#38290f;--del:#ef7a63;--del-soft:#3b1c17;
  --heat-strong:#e3ebff;--dotc:rgba(231,236,246,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-theme="dark"] .hiw{--shadow-up:0 2px 4px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.8)}
:root[data-theme="dark"] .btn-primary{box-shadow:0 8px 18px -10px rgba(76,125,255,.7)}
body,.card,.side,.topbar,.btn,.chip,.seg button{transition-property:background-color,border-color,color,box-shadow,transform;transition-duration:.3s}

/* light scope: slides and respondent screens stay light in both themes */
.sl-canvas,.dslide,.phone-in,.dev-in{--ink:#152440;--ink-2:#2c3a52;--muted:#5b6b82;--faint:#8a97ab;--line:#e2e8f1;--line-2:#eef2f7;--paper:#fff;--paper-2:#fbfcff;--soft:#f1f3f8;--accent:#245cf4;--accent-deep:#1f4fd6;--accent-soft:#edf3ff;--accent-line:#cbdafd;--ok:#2e7d5b;--ok-soft:#e3f3ed;color:#152440}

/* view transitions */
html.vt .view{animation:none}
::view-transition-old(root){animation:vtOut .22s ease both}
::view-transition-new(root){animation:vtIn .42s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
.side{view-transition-name:side}
.topbar{view-transition-name:topbar}
::view-transition-old(side),::view-transition-new(side),::view-transition-old(topbar),::view-transition-new(topbar){animation:none}

/* sidebar: scrolling nav, sliding indicator, project picker */
.navwrap{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -6px;padding:0 6px 8px;scrollbar-width:thin}
.nav-ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:10px;background:var(--accent-soft);opacity:0;pointer-events:none;z-index:0;transition:transform .5s var(--ease),width .3s var(--ease),height .3s var(--ease),opacity .2s}
.nav{position:relative;z-index:1}
.nav-item.active>.nav-btn{background:transparent;color:var(--accent-deep)}
.nav-item.active.open>.nav-btn{background:transparent}
.subnav a[aria-current]{background:transparent}
.nav-btn .badge.warn{background:var(--warn-soft);color:var(--warn)}
.navlabel.pl{margin-top:14px}
.projbtn{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin:0 0 6px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);text-align:left;transition:border-color .2s,box-shadow .2s}
.projbtn:hover{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.projbtn .pn{min-width:0;flex:1;line-height:1.25}
.projbtn .pn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projbtn .pn small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.projbtn .pc{width:15px;height:15px;color:var(--faint)}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--faint)}
.pdot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);animation:lp-beat 1.8s infinite}
.pdot.analysis{background:var(--accent)}
.pdot.draft{background:var(--warn)}
.pdot.closed{background:var(--muted)}
.app.collapsed .projbtn{justify-content:center;padding:9px}
.app.collapsed .projbtn .pn,.app.collapsed .projbtn .pc,.app.collapsed .navlabel.pl{display:none}
.nav-item.single .nav-btn .sp{margin-left:auto}
.projpop{position:fixed;z-index:85;width:320px;max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -30px rgba(10,20,40,.55);padding:8px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.projpop.open{opacity:1;transform:none;pointer-events:auto}
.pp-h{font-size:12px;font-weight:600;color:var(--muted);padding:6px 10px 4px}
.pp-g{font-size:11px;font-weight:600;color:var(--faint);padding:10px 10px 4px}
.projpop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left}
.projpop button:hover,.projpop button:focus-visible{background:var(--hover)}
.projpop button[aria-selected]{background:var(--accent-soft)}
.projpop button b{display:block;font-size:13px}
.projpop button small{display:block;font-size:11.5px;color:var(--muted)}
.projpop button span:nth-child(2){flex:1;min-width:0}
.projpop button svg{color:var(--accent);width:16px;height:16px}
button.project{cursor:pointer}
.project .dot.live{background:var(--ok)}.project .dot.draft{background:var(--warn)}.project .dot.closed{background:var(--muted)}
.project svg{width:14px;height:14px;color:var(--faint)}
.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--ink)}

/* motion: reveal on scroll, count-up, bursts, presses */
.rvl{opacity:0;transform:translateY(14px);transition:opacity .55s var(--ease),transform .65s var(--ease)}
.rvl.in{opacity:1;transform:none}
.card.rvl:not(.in) .hbar .tr i,.card.rvl:not(.in) .vcols i,.card.rvl:not(.in) .mini-h .tr i{animation-play-state:paused}
.heat td{animation:cellIn .5s var(--ease) both}
.heat tr:nth-child(2) td{animation-delay:.04s}.heat tr:nth-child(3) td{animation-delay:.08s}.heat tr:nth-child(4) td{animation-delay:.12s}.heat tr:nth-child(5) td{animation-delay:.16s}.heat tr:nth-child(6) td{animation-delay:.2s}
.card.rvl:not(.in) .heat td{animation-play-state:paused}
@keyframes cellIn{from{opacity:0;transform:scale(.92)}}
.mini-h .tr i{transform-origin:left;animation:grow .9s var(--ease) both}
.btn:active{transform:scale(.97)}
.burst{position:fixed;z-index:120;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .65s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3);opacity:0}}
.toast{display:flex;align-items:center;gap:8px}
.toast svg{width:16px;height:16px;color:#7ee2b0}
:root[data-theme="dark"] .toast{background:#e7ecf6;color:#0b1222}
:root[data-theme="dark"] .toast svg{color:#2e7d5b}

/* AI working panel */
.airun{position:fixed;right:24px;bottom:24px;z-index:95;width:340px;border-radius:18px;padding:2px;overflow:hidden;opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);box-shadow:0 24px 60px -24px rgba(122,90,248,.55),0 10px 30px -18px rgba(36,92,244,.6)}
.airun.open{opacity:1;transform:none}
.airun::before{content:"";position:absolute;left:50%;top:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:conic-gradient(from 0deg,#245cf4,#7a5af8,#36c2f4,#245cf4);animation:hw-spin 3.5s linear infinite}
.airun.done::before{background:conic-gradient(from 0deg,#2e7d5b,#4cc38a,#2e7d5b)}
.airun-in{position:relative;display:flex;gap:14px;padding:16px 18px;border-radius:16px;background:var(--paper)}
.airun .orb{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#fff 0,#b8c9ff 18%,#245cf4 52%,#7a5af8 100%);animation:hw-breathe 2.4s ease-in-out infinite}
.airun .orb svg{width:18px;height:18px;fill:#fff;stroke:none}
.airun.done .orb{background:radial-gradient(circle at 32% 28%,#fff 0,#b7f0d4 20%,#2e7d5b 70%)}
.airun-t b{display:block;font-size:13.5px;margin:2px 0 8px}
.airun ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.airun li{position:relative;padding-left:20px;font-size:12.5px;color:var(--faint);transition:color .25s}
.airun li::before{content:"";position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.airun li.on{color:var(--ink)}
.airun li.on::before{border-color:var(--accent);border-right-color:transparent;animation:hw-spin .7s linear infinite}
.airun li.ok{color:var(--muted)}
.airun li.ok::before{background:var(--ok);border-color:var(--ok)}

/* modal and Word import */
.modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(10,20,40,.38);backdrop-filter:blur(4px);padding:20px}
.modal.open{display:grid;animation:fadeIn .2s ease}
.modal-box{width:min(560px,100%);background:var(--paper);border-radius:20px;box-shadow:0 40px 90px -30px rgba(10,20,40,.6);overflow:hidden;animation:pop .35s var(--ease)}
.mh{display:flex;align-items:center;padding:18px 22px 6px}.mh h2{margin:0;font-size:17px}
.mh .x{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}.mh .x:hover{background:var(--hover)}
.mb{padding:10px 22px 4px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px}
.drop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:34px 20px;border:1.5px dashed var(--accent-line);border-radius:16px;background:var(--paper-2);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.drop:hover,.drop.over{background:var(--accent-soft);border-color:var(--accent);border-style:solid}
.drop.over{transform:scale(1.01)}
.drop-ic{width:56px;height:56px;border-radius:16px;background:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:6px;animation:float 3s ease-in-out infinite}
.drop-ic .ico{width:30px;height:30px}
.drop b{font-size:14px}.drop small{color:var(--muted);font-size:12.5px;max-width:34ch}
@keyframes float{50%{transform:translateY(-5px)}}
.drop-err{display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--del-soft);color:var(--del);animation:shake .4s}
.drop-err svg{flex-shrink:0}.drop-err b{display:block;font-size:13.5px}.drop-err small{font-size:12.5px;color:var(--ink-2)}
.drop-err .btn{margin-left:auto}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* empty states and banners */
.empty .es{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px 52px}
.empty.flat .es{padding:30px 10px}
.es-art{width:180px;height:124px;margin-bottom:10px}
.es-art .a1{fill:var(--accent-soft)}
.es-art .a2{fill:var(--paper);stroke:var(--accent-line);stroke-width:2}
.es-art .a3{fill:var(--accent);stroke:var(--accent)}
.es-art .a4{fill:var(--accent-line);animation:float 3s ease-in-out infinite}
.es-art .a5{fill:var(--line)}
.es-art .a2,.es-art .a3{animation:float 4s ease-in-out infinite}
.es-art .a3{animation-delay:.4s}
.es h2{margin:0 0 6px;font-size:18px;font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600}
.es p{margin:0;max-width:52ch;color:var(--muted)}
.es-acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.interim{display:flex;gap:12px;align-items:center;padding:12px 16px;margin:-6px 0 18px;border-radius:14px;background:var(--ok-soft);color:var(--ok)}
.interim b{display:block;font-size:13.5px;color:var(--ink)}.interim span{font-size:12.5px;color:var(--muted)}
.interim.lock{background:var(--accent-soft);color:var(--accent)}

/* project home */
.ph-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.nx{list-style:none;margin:0;padding:0}
.nx li{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.nx li:first-child{border-top:0;padding-top:2px}
.nx-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.nx b{display:block;font-size:13.5px}.nx small{font-size:12.5px;color:var(--muted)}
.brief-grid.one{grid-template-columns:1fr 1fr}
svg.sm{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.kpis.kp3{grid-template-columns:repeat(3,1fr)}
.kpi b span{font-size:inherit;color:inherit}

/* questionnaire builder */
.qb{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:18px;align-items:start}
.qb-out{position:sticky;top:78px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
.qb-oh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:13px}
.qb-oh span{color:var(--muted);font-size:12px}
.qb-ol{overflow:auto;padding:0 8px 12px}
.qb-sec{margin-bottom:6px}
.qb-st{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 8px 4px}
.qb-st span{width:18px;height:18px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:10.5px}
.qb-q{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:9px;text-align:left;font-size:12.5px;color:var(--ink-2);transition:background .15s}
.qb-q:hover{background:var(--hover)}
.qb-q.on{background:var(--accent-soft);color:var(--accent-deep)}
.qb-q .no{flex-shrink:0;width:30px;font-size:11px;font-weight:600;color:var(--faint)}
.qb-q.on .no{color:var(--accent)}
.qb-q .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb-q .lg{width:14px;height:14px;color:var(--accent)}
.qb-add{display:flex;align-items:center;gap:6px;padding:6px 8px;margin-left:30px;font-size:12px;color:var(--accent-deep);border-radius:8px}
.qb-add:hover{background:var(--accent-soft)}
.qb-add svg{width:14px;height:14px}
.qb-ed{padding:18px 20px 16px;min-height:420px}
.qe-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qno{font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:20px;color:var(--accent);min-width:46px}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;border:1px solid var(--line);border-radius:10px;padding:7px 32px 7px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--paper-2);cursor:pointer}
.sel select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel svg{position:absolute;right:10px;width:14px;height:14px;pointer-events:none;color:var(--muted)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog span{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.tog span::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.tog input:checked+span{background:var(--accent)}
.tog input:checked+span::after{transform:translateX(12px)}
.tog input:focus-visible+span{box-shadow:0 0 0 3px var(--accent-soft)}
.fl{display:grid;gap:6px;margin-bottom:14px}
.fl>span{font-size:12px;font-weight:600;color:var(--muted)}
.fl textarea,.inico input,.opts input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper-2);resize:vertical;transition:border-color .2s,box-shadow .2s}
.fl textarea{font-size:15px;font-weight:500;line-height:1.45}
.fl textarea:focus,.inico input:focus,.opts input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--paper)}
.inico{position:relative}.inico svg{position:absolute;left:11px;top:50%;margin-top:-9px;color:var(--accent)}.inico input{padding-left:36px;font-size:13px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.opts li{display:flex;align-items:center;gap:6px;animation:optIn .3s var(--ease)}
.opts li.out{animation:optOut .18s ease forwards}
@keyframes optIn{from{opacity:0;transform:translateY(-4px)}}
@keyframes optOut{to{opacity:0;transform:translateX(10px)}}
.opts input{padding:7px 10px;font-size:13px}
.opts .grip{color:var(--faint);cursor:grab}.opts .grip svg{width:16px;height:16px}
.opts .rm{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex-shrink:0}
.opts .rm:hover{background:var(--del-soft);color:var(--del)}
.opts .rm svg{width:15px;height:15px}
.add-o{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--accent-deep)}
.add-o:hover{background:var(--accent-soft)}.add-o svg{width:14px;height:14px}
.note-box{padding:10px 12px;border-radius:10px;background:var(--soft);font-size:12.5px;color:var(--muted)}
.qe-f{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.btn.danger:hover{background:var(--del-soft);border-color:var(--del);color:var(--del)}
.ai-sug{margin:0 0 14px;padding:14px 16px;border-radius:14px;border:1px solid var(--accent-line);background:linear-gradient(135deg,var(--accent-soft),var(--paper));animation:pop .35s var(--ease)}
.ai-sug b{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent-deep)}
.ai-sug b svg{width:15px;height:15px}
.ai-sug p{margin:6px 0 10px;font-size:14.5px;font-weight:500}
.ai-sug div{display:flex;gap:8px}
.qb-pv{position:sticky;top:78px}
.pv-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 10px}
.pv-h svg{width:15px;height:15px}
.phone{width:100%;max-width:300px;aspect-ratio:9/17.5;border-radius:36px;padding:10px;background:#0f1a30;box-shadow:0 30px 60px -30px rgba(10,20,40,.6),inset 0 0 0 2px #26324b;position:relative}
.phone::before{content:"";position:absolute;left:50%;top:16px;width:70px;height:18px;margin-left:-35px;border-radius:12px;background:#0f1a30;z-index:2}
.phone-in{height:100%;border-radius:28px;background:#f7f9fc;overflow:auto;padding:46px 16px 18px}
.rq.flip{animation:flip .4s var(--ease)}
@keyframes flip{from{opacity:0;transform:translateX(14px)}}

/* respondent question atoms */
.rq-no{font-size:11.5px;font-weight:600;color:var(--accent);margin-bottom:4px}
.rq-t{margin:0 0 12px;font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:17px;line-height:1.3;color:#152440}
.rq-logic{display:flex;align-items:center;gap:6px;font-size:11px;color:#5b6b82;background:#edf3ff;border-radius:8px;padding:5px 8px;margin:-4px 0 12px}
.rq-logic svg{width:13px;height:13px;color:#245cf4}
.rq-opts{display:grid;gap:7px}
.rq-o{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1.5px solid #e2e8f1;border-radius:12px;background:#fff;font-size:13.5px;text-align:left;color:#152440;transition:border-color .15s,background .15s,transform .15s}
.rq-o:hover{border-color:#cbdafd}
.rq-o:active{transform:scale(.98)}
.rq-o.on{border-color:#245cf4;background:#edf3ff}
.rq-mk{width:18px;height:18px;border-radius:50%;border:1.5px solid #cbd3e1;display:grid;place-items:center;flex-shrink:0;transition:all .15s}
.rq-mk.sq{border-radius:5px}
.rq-o.on .rq-mk{background:#245cf4;border-color:#245cf4;color:#fff}
.rq-mk svg{width:12px;height:12px;stroke-width:3}
.rq-rk{width:22px;height:22px;border-radius:7px;border:1.5px dashed #cbd3e1;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.rq-o.on .rq-rk{border-style:solid;background:#245cf4;border-color:#245cf4;color:#fff;animation:pop .3s var(--ease)}
.rq-hint{margin:-4px 0 10px;font-size:12px;color:#5b6b82}
.rq-scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.rq-scale button{aspect-ratio:1/1.25;border-radius:8px;border:1.5px solid #e2e8f1;background:#fff;font-size:12.5px;font-weight:600;color:#152440;transition:all .15s}
.rq-scale button:hover{border-color:#cbdafd}
.rq-scale button.on{background:#245cf4;border-color:#245cf4;color:#fff;transform:translateY(-2px)}
.rq-ends{display:flex;justify-content:space-between;font-size:11px;color:#8a97ab;margin-top:6px}
.rq-grid{display:grid;gap:10px}
.rq-gr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:12.5px;color:#152440}
.rq-gr input{grid-column:1/-1;accent-color:#245cf4;width:100%}
.rq-gr b{font-size:13px;color:#245cf4;grid-row:1;grid-column:2}
.rq-open{width:100%;min-height:110px;border:1.5px solid #e2e8f1;border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;color:#152440;background:#fff;resize:vertical}
.rq-open:focus{outline:none;border-color:#245cf4}

/* respondent view */
.rv-stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.dev{margin:0 auto;background:#0f1a30;box-shadow:0 40px 80px -40px rgba(10,20,40,.7),inset 0 0 0 2px #26324b;transition:width .5s var(--ease),height .5s var(--ease),border-radius .5s var(--ease),padding .5s var(--ease)}
.dev.mobile{width:380px;height:760px;border-radius:44px;padding:12px}
.dev.desktop{width:100%;max-width:860px;height:600px;border-radius:16px;padding:30px 10px 10px}
.dev-top{position:relative;height:0}
.dev.mobile .dev-top span{position:absolute;left:50%;top:6px;width:90px;height:22px;margin-left:-45px;border-radius:14px;background:#0f1a30;z-index:2}
.dev.desktop .dev-top span{position:absolute;left:8px;top:-20px;width:44px;height:10px;background:radial-gradient(circle at 5px 5px,#ef7a63 4px,transparent 4.5px),radial-gradient(circle at 20px 5px,#e3a24a 4px,transparent 4.5px),radial-gradient(circle at 35px 5px,#4cc38a 4px,transparent 4.5px)}
.dev-in{height:100%;border-radius:34px;background:#f7f9fc;overflow:hidden;transition:border-radius .5s}
.dev.desktop .dev-in{border-radius:8px}
.rv{height:100%;display:flex;flex-direction:column}
.rv-top{display:flex;align-items:center;justify-content:space-between;padding:44px 20px 10px;font-size:12px;color:#5b6b82}
.dev.desktop .rv-top{padding:16px 28px 10px}
.rv-brand{display:flex;align-items:center;gap:7px;font-weight:600;color:#152440}.rv-brand .ico{width:18px;height:18px}
.rv-pr{height:4px;margin:0 20px;border-radius:2px;background:#e6ebf3;overflow:hidden}
.rv-pr i{display:block;height:100%;background:linear-gradient(90deg,#245cf4,#7a5af8);border-radius:2px;transition:width .5s var(--ease)}
.rv-body{flex:1;overflow:auto;padding:22px 20px}
.dev.desktop .rv-body{padding:30px 15% 20px}
.rv-body.fwd{animation:slideFwd .45s var(--ease)}
.rv-body.back{animation:slideBack .45s var(--ease)}
.rv-body.shake{animation:shake .4s}
@keyframes slideFwd{from{opacity:0;transform:translateX(30px)}}
@keyframes slideBack{from{opacity:0;transform:translateX(-30px)}}
.rv-err{margin:12px 0 0;font-size:12.5px;font-weight:600;color:#b4432f}
.rv-nav{display:flex;gap:8px;padding:12px 20px 22px}
.dev.desktop .rv-nav{padding:12px 15% 24px}
.rv-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;background:#245cf4;color:#fff;font-weight:600;font-size:14px;transition:transform .15s,background .2s}
.rv-btn:hover{background:#1f4fd6}.rv-btn:active{transform:scale(.97)}
.rv-btn.ghost{flex:0 0 46px;background:#fff;color:#152440;border:1.5px solid #e2e8f1}
.rv-nav .rv-btn.ghost:only-child{flex:1}
.rv-btn svg{width:17px;height:17px}
.rv-wel,.rv-end{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;min-height:100%;gap:10px;color:#152440}
.rv-wel .ico{width:56px;height:56px;animation:float 3s ease-in-out infinite}
.rv-wel h3,.rv-end h3{margin:6px 0 0;font-family:DedaleGeneral,DedaleInter,sans-serif;font-size:22px;font-weight:600}
.rv-wel p,.rv-end p{margin:0;color:#5b6b82;font-size:14px;max-width:30ch}
.rv-end svg.big{width:64px;height:64px;padding:14px;border-radius:50%;background:#e3f3ed;color:#2e7d5b;stroke-width:2.4;animation:pop .45s var(--ease)}
.rv-side .lnkbox{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--ink-2)}
.rv-side .lnkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-side .lnkbox .btn{padding:6px 8px}
.rv-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.rv-facts div{padding:10px;border-radius:10px;background:var(--soft)}
.rv-facts dt{font-size:11px;color:var(--muted)}.rv-facts dd{margin:0;font-weight:600;font-size:14px}
.rv-h3{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:4px 0 8px}
.rv-h3 svg{width:15px;height:15px;color:var(--accent)}
.rv-logic{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rv-logic li{font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.rv-logic b{color:var(--accent);margin-right:6px}

/* client review */
.rvw{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.seg.sm button{font-size:12px;padding:4px 10px}
.df-list .df-sec{margin-bottom:10px}
.df-st{font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 0 6px}
.df{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;margin-bottom:4px;transition:background .3s}
.df .no{flex-shrink:0;width:36px;font-size:11.5px;font-weight:600;color:var(--faint)}
.df-t{flex:1;min-width:0;font-size:13.5px;display:grid;gap:3px}
.df-t del{color:var(--del);text-decoration-thickness:1.5px;opacity:.8}
.df-t ins{text-decoration:none;color:var(--ink);background:linear-gradient(transparent 60%,var(--ok-soft) 60%)}
.df.edited{background:var(--paper-2);border-color:var(--line)}
.df.added{background:var(--ok-soft);border-color:transparent;box-shadow:inset 3px 0 0 var(--ok)}
.df.removed{background:var(--del-soft);box-shadow:inset 3px 0 0 var(--del)}
.df.removed .df-t del{color:var(--ink-2)}
.df-b{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.df-b.edited{background:var(--accent-soft);color:var(--accent-deep)}
.df-b.added{background:var(--ok);color:#fff}
.df-b.removed{background:var(--del);color:#fff}
.df-c{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft)}
.df-c svg{width:13px;height:13px}
.df-c.open{background:var(--warn-soft);color:var(--warn)}
.df-list.only .df.same:not(.has-t){display:none}
.df.flash,.th.flash{animation:flashBg 1.4s ease}
@keyframes flashBg{0%,40%{box-shadow:0 0 0 3px var(--accent)}}
.vers{list-style:none;margin:0;padding:0;position:relative}
.vers::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:1.5px solid var(--line)}
.vers li{position:relative;display:flex;gap:12px;padding:0 0 14px}
.vers li:last-child{padding-bottom:0}
.vdot{position:relative;z-index:1;width:13px;height:13px;border-radius:50%;margin-top:3px;background:var(--paper);border:2px solid var(--accent-line);flex-shrink:0}
.vers li.cur .vdot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.vers b{display:flex;align-items:baseline;gap:8px;font-size:13.5px}.vers b small{font-weight:400;font-size:12px;color:var(--faint)}
.vers span{font-size:12.5px;color:var(--muted)}
.ths{display:grid;gap:12px;max-height:560px;overflow:auto}
.th{border:1px solid var(--line);border-radius:14px;padding:12px}
.th.open{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.th.just{animation:resolved 1s ease}
@keyframes resolved{0%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:none}}
.th-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.th-h a{font-weight:700;font-size:12.5px;color:var(--accent-deep)}
.msgx{display:flex;gap:10px;margin-top:10px}
.msgx .av{width:26px;height:26px;font-size:10px}
.msgx b{display:flex;gap:8px;align-items:baseline;font-size:12.5px}.msgx b small{font-weight:400;color:var(--faint);font-size:11.5px}
.msgx p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.msgx.me .av{background:var(--accent);color:#fff}
.th-r{display:flex;gap:6px;margin-top:12px}
.th-r input{flex:1;border:1px solid var(--accent-line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);background:var(--paper-2)}
.th-r input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.th-r .btn{padding:8px 10px}

/* reports: proposals and deck */
.sl-foot .k svg{width:14px;height:14px;display:none}
.sl-foot .k[aria-pressed="true"] svg{display:inline}
.sl-foot .k{display:inline-flex;align-items:center;gap:5px}
.sl.pop{animation:slPop .45s var(--ease)}
@keyframes slPop{40%{transform:scale(1.02)}}
.sl.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sl-foot .k.nudge{animation:shake .4s}
.deck{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.deck-th{display:grid;gap:10px;max-height:calc(100vh - 220px);overflow:auto;padding:2px}
.dth{position:relative;display:block;width:100%;border-radius:10px;padding:3px;border:2px solid transparent;transition:border-color .2s,transform .2s}
.dth:hover{transform:translateX(2px)}
.dth.on{border-color:var(--accent)}
.dth em{position:absolute;left:-2px;top:-2px;font-style:normal;font-size:10.5px;font-weight:700;background:var(--paper);color:var(--muted);border-radius:6px;padding:0 5px}
.dth.on em{background:var(--accent);color:#fff}
.dsw{display:block;position:relative;width:100%;overflow:hidden;border-radius:8px;box-shadow:var(--shadow)}
.dsw>.dslide{position:absolute;left:0;top:0;transform-origin:0 0}
.deck-stage .dsw{border-radius:14px;box-shadow:0 30px 70px -40px rgba(10,20,40,.6)}
.dsw.fwd{animation:slideFwd .45s var(--ease)}.dsw.back{animation:slideBack .45s var(--ease)}
.deck-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn.ic{padding:8px}
.dslide{width:960px;height:540px;background:#fff;padding:36px 48px 30px;display:flex;flex-direction:column;--ds-a:#245cf4}
.ds-top{display:flex;align-items:center;gap:10px;font-size:14px;color:#5b6b82}
.ds-top .ico{width:22px;height:22px}
.ds-n{margin-left:auto;font-variant-numeric:tabular-nums}
.dslide h2{margin:18px 0 26px;font-family:DedaleGeneral,DedaleInter,sans-serif;font-weight:600;font-size:34px;line-height:1.15;letter-spacing:-.01em;color:#152440;max-width:820px}
.ds-body{flex:1;display:grid;grid-template-columns:1fr 250px;gap:36px;align-items:start}
.ds-chart{display:grid;gap:16px}
.ds-r{display:grid;grid-template-columns:200px 1fr 64px;gap:16px;align-items:center;font-size:17px;color:#2c3a52}
.ds-tr{height:20px;border-radius:5px;background:#eef2f7;overflow:hidden}
.ds-tr i{display:block;height:100%;border-radius:5px;background:#9bb6fb;transform-origin:left;animation:grow .9s var(--ease) both}
.ds-r b{text-align:right;font-size:18px;color:#152440;font-variant-numeric:tabular-nums}
.ds-take{padding:20px;border-radius:14px;background:#edf3ff;border-left:4px solid #245cf4}
.ds-take b{display:block;font-size:13px;color:#1f4fd6;margin-bottom:6px}
.ds-take p{margin:0;font-size:16px;line-height:1.45;color:#152440}
.ds-foot{display:flex;justify-content:space-between;font-size:12px;color:#8a97ab;border-top:1px solid #eef2f7;padding-top:12px;margin-top:16px}
.dslide.cover{background:radial-gradient(700px 400px at 85% -10%,rgba(91,140,255,.55),transparent 60%),#0e2a78;color:#fff;justify-content:space-between;padding:48px 56px}
.dslide.cover .ico{width:44px;height:44px;background-color:#fff;border-radius:12px}
.dslide.cover small{font-size:16px;opacity:.75}
.dslide.cover h2{color:#fff;font-size:54px;margin:8px 0 10px}
.dslide.cover p{margin:0;font-size:18px;opacity:.8}
.ds-brand{font-size:14px;opacity:.7}
.present{position:fixed;inset:0;z-index:110;background:#05080f;display:none;place-items:center;cursor:pointer}
.present.open{display:grid;animation:fadeIn .3s ease}
.present .pw{display:grid;place-items:center}
.present .dsw{border-radius:6px;box-shadow:none;width:auto}
.present .px{position:absolute;right:20px;top:20px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.08)}
.present .pn{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.55);font-size:13px}

/* copilot thinking state and fieldwork save */
.msg.sk{display:grid;gap:7px;width:62%}
.msg.sk i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line) 0%,var(--accent-line) 50%,var(--line) 100%);background-size:200% 100%;animation:skel 1.2s linear infinite}
.msg.sk i:nth-child(2){width:85%}.msg.sk i:nth-child(3){width:55%}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.msg.ai .acts .btn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
#saveQ{min-width:140px;justify-content:center}
#saveQ.saving{pointer-events:none;opacity:.85}
#saveQ.saving svg{animation:hw-spin .7s linear infinite}
#saveQ.saved{background:var(--ok);box-shadow:0 8px 18px -10px rgba(46,125,91,.8)}
.export button:disabled{opacity:.45;cursor:not-allowed}
.scope-detail.swap,#scopeDetail.swap{animation:vtIn .4s var(--ease)}
.cmdk-box{background:var(--paper)}
.cmdk-box input{background:transparent;color:var(--ink)}
.cmdk-box .cg{font-size:11px;font-weight:600;color:var(--faint);padding:10px 10px 4px}
.cmdk-box li button svg{width:16px;height:16px;color:var(--muted)}
.cmdk-box li button.sel svg{color:var(--accent)}
.tpl.card{text-align:left}

/* responsive */
@media (max-width:1180px){
  .qb{grid-template-columns:230px minmax(0,1fr)}
  .qb-pv{display:none}
  .rvw,.rv-stage{grid-template-columns:1fr}
  .ph-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .page-head .actions{flex-wrap:wrap}
  .crumbs>a{display:none}
  .qb{grid-template-columns:1fr}
  .qb-out{position:static;max-height:260px}
  .deck{grid-template-columns:1fr}
  .deck-th{grid-auto-flow:column;grid-auto-columns:140px;max-height:none;overflow-x:auto}
  .kpis.kp3{grid-template-columns:1fr}
  .dev.mobile{width:100%;max-width:360px;height:700px}
  .airun{left:12px;right:12px;bottom:12px;width:auto}
}
@media (max-width:700px){
  .t thead{display:none}
  .t,.t tbody,.t tr,.t td{display:block;width:100%}
  .t tr{padding:12px 0;border-bottom:1px solid var(--line-2)}
  .t td{border:0;padding:4px 0}
  .t td.hide-m{display:none}
  .t td[data-label="Stage"],.t td[data-label="Responses"]{display:inline-block;width:auto;margin-right:12px;vertical-align:middle}
  .t td.act{text-align:left!important;padding-top:6px}
  .t .name{min-width:0}
  .lp-in,.lp-rail{min-width:0!important}
  .lp-track{overflow:visible}
  .lp-base,.lp-done,.lp-cur,.lp-rail{display:none}
  .lp-steps{grid-template-columns:1fr;gap:4px;position:relative}
  .lp-steps::before{content:"";position:absolute;left:31px;top:22px;bottom:22px;border-left:2px dashed var(--line)}
  .lp-step a{display:grid;grid-template-columns:44px 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;padding:10px}
  .lp-node{grid-row:1/3}
  .lp-step b{margin:0}
  .lp-d{grid-column:2}
  .lp-tag{grid-column:3;grid-row:1/3;margin:0}
  .brief-grid.one{grid-template-columns:1fr}
  .nx li{grid-template-columns:38px 1fr}
  .nx li .btn{grid-column:2;justify-self:start}
  .ds-body{grid-template-columns:1fr}
}


/* =====================================================================
   v4 design layer. Three skins on one system: 4A Clarity, 4B Aurora, 4C Ink.
   ===================================================================== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --side:276px;--r-lg:20px;--r-md:14px;--r-sm:10px;
  --violet:#7a5af8;--cyan:#36c2f4;--g1:#245cf4;--g2:#6f9bff;--glow:rgba(36,92,244,.35);
  --display:DedaleGeneral,DedaleInter,sans-serif;
  --card:var(--paper);--card-line:var(--line);--side-bg:var(--paper);
  --shadow:0 0 0 1px rgba(21,36,64,.02),0 1px 2px rgba(21,36,64,.05),0 14px 34px -20px rgba(21,36,64,.28);
  --shadow-hi:0 0 0 1px rgba(36,92,244,.10),0 2px 4px rgba(21,36,64,.05),0 26px 50px -24px rgba(36,92,244,.38);
  --hero-bg:linear-gradient(180deg,var(--paper),var(--paper));
  --hero-side:linear-gradient(160deg,#f3f7ff 0%,#fbfcff 60%);
  --amb1:rgba(36,92,244,.20);--amb2:rgba(122,90,248,.12);--amb3:rgba(54,194,244,.12);
  --spot:rgba(36,92,244,.055);
  --btn-a:#3b70f8;--btn-b:#1f50e4;
}
:root[data-theme="dark"]{
  --bg:#090e1b;--paper:#111a2d;--paper-2:#142036;--soft:#1a2540;--hover:#16213a;--line:#222e48;--line-2:#1a2540;--topbar:rgba(9,14,27,.78);
  --g1:#4c7dff;--g2:#8fb0ff;--glow:rgba(76,125,255,.45);
  --shadow:0 0 0 1px rgba(255,255,255,.02),0 1px 2px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.8);
  --shadow-hi:0 0 0 1px rgba(76,125,255,.25),0 26px 50px -24px rgba(76,125,255,.35);
  --hero-side:linear-gradient(160deg,#15223f 0%,#111a2d 70%);
  --amb1:rgba(76,125,255,.20);--amb2:rgba(122,90,248,.14);--amb3:rgba(54,194,244,.08);
  --spot:rgba(120,160,255,.07);
  --btn-a:#5a88ff;--btn-b:#3a69f0;
}

/* ---------- ambient background ---------- */
body{font-feature-settings:"cv11","ss01";text-rendering:optimizeLegibility}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;will-change:transform}
.amb i:nth-child(1){width:980px;height:760px;right:-260px;top:-380px;background:radial-gradient(closest-side,var(--amb1),transparent);animation:amb1 28s ease-in-out infinite alternate}
.amb i:nth-child(2){width:820px;height:640px;left:14%;top:-420px;background:radial-gradient(closest-side,var(--amb2),transparent);animation:amb2 34s ease-in-out infinite alternate}
.amb i:nth-child(3){width:760px;height:620px;right:8%;bottom:-420px;background:radial-gradient(closest-side,var(--amb3),transparent);animation:amb1 40s ease-in-out infinite alternate-reverse}
.amb::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dotc) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 420px);mask-image:linear-gradient(180deg,#000,transparent 420px)}
@keyframes amb1{to{transform:translate(-120px,70px) scale(1.12)}}
@keyframes amb2{to{transform:translate(160px,50px) scale(.92)}}
.app{position:relative;z-index:1}
::selection{background:rgba(36,92,244,.22)}

/* ---------- sidebar: floating panel ---------- */
.side{top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;border:1px solid var(--card-line);border-radius:22px;background:var(--side-bg);box-shadow:var(--shadow);padding:16px 12px 12px}
.brand{padding:2px 6px 16px}
.brand .ico-logo{width:34px;height:34px;transition:transform .6s var(--ease)}
.brand:hover .ico-logo{transform:rotate(-14deg) scale(1.06)}
.brand-txt b{font-size:16.5px;letter-spacing:-.01em}
.jump{border-radius:12px;padding:9px 11px;background:var(--bg);border-color:transparent;transition:border-color .2s,box-shadow .2s,background .2s}
.jump:hover{border-color:var(--accent-line);background:var(--paper);box-shadow:0 0 0 4px var(--accent-soft)}
.jump kbd{border-radius:6px;padding:1px 6px;box-shadow:0 1px 0 var(--line)}
.navlabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;padding:8px 10px 6px}
.nav-btn{font-size:13.5px;padding:8px 10px;border-radius:11px}
.nav-btn:hover{background:var(--bg)}
.nav-btn:hover .i{color:var(--ink)}
.nav-btn .i{transition:color .18s,transform .3s var(--ease)}
.nav-btn:active .i{transform:scale(.88)}
.nav-ind{border-radius:11px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.nav-btn .badge{font-size:10.5px;padding:1px 7px;border:1px solid var(--line)}
.subnav a{font-size:13px;padding:6px 10px}
.projbtn{border-radius:14px;padding:10px 11px;background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:0 1px 2px rgba(21,36,64,.04)}
.side-foot{gap:10px;padding-top:12px}
.skin{display:none;align-items:center;gap:8px;padding:0 4px 0 8px;font-size:11.5px;font-weight:600;color:var(--faint)}
.skin .seg{margin-left:auto}
.skin .seg button{padding:4px 11px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.skin .seg button[aria-pressed="true"]{color:var(--accent-deep)}
.me{padding:6px 4px 2px 6px}
.me>div:first-of-type{min-width:0;flex:1}
.me b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{background:linear-gradient(135deg,var(--g1),var(--violet));color:#fff;box-shadow:0 4px 10px -4px var(--glow)}
.me .av{color:#fff;font-size:11px}
.me-acts{display:flex;gap:2px;flex-shrink:0}
.icb{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .18s,color .18s,transform .3s var(--ease)}
.icb:hover{background:var(--bg);color:var(--ink)}
.icb:active{transform:scale(.9) rotate(-12deg)}
.icb svg{width:17px;height:17px}
.icb span{display:none}
.app.collapsed .skin{display:none}
.app.collapsed .side{padding-left:8px;padding-right:8px}

/* ---------- topbar ---------- */
.topbar{padding:14px 32px 12px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;transition:background .3s,border-color .3s}
.topbar.scrolled{background:var(--topbar);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.crumbs{font-size:12.5px}
.project{box-shadow:0 1px 2px rgba(21,36,64,.05);transition:border-color .2s,box-shadow .2s}
.project:hover{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}

/* ---------- buttons ---------- */
.btn{position:relative;border-radius:11px;padding:8px 14px;letter-spacing:-.003em;overflow:hidden;isolation:isolate}
.btn-primary{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.12),0 1px 2px rgba(20,50,160,.35),0 10px 22px -10px var(--glow)}
.btn-primary::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.32) 48%,transparent 62%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn-primary:hover{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));filter:brightness(1.06);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 4px rgba(20,50,160,.3),0 16px 28px -12px var(--glow)}
.btn-primary:hover::after{transform:translateX(120%)}
.btn-ghost{background:var(--paper);box-shadow:0 1px 2px rgba(21,36,64,.05)}
.btn-ghost:hover{transform:translateY(-1px);box-shadow:0 0 0 4px var(--accent-soft)}
.btn-ai{border:1.5px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,conic-gradient(from var(--ang),var(--g1),var(--violet),var(--cyan),var(--g1)) border-box;color:var(--ink);animation:ang 5s linear infinite}
.btn-ai .i{color:var(--violet)}
.btn-ai:hover{box-shadow:0 0 0 4px var(--accent-soft),0 10px 26px -12px rgba(122,90,248,.6);transform:translateY(-1px)}
@keyframes ang{to{--ang:360deg}}
.btn:active{transform:scale(.97)}

/* ---------- page head and cards ---------- */
.page{max-width:1280px;padding:22px 32px 96px}
.page-head{margin-bottom:26px;align-items:flex-end}
.page-head h1{font-size:40px;letter-spacing:-.03em;line-height:1.04}
.page-head p.lead{font-size:15px;margin-top:10px;line-height:1.5}
.page-head .hello{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);margin:0 0 12px}
.page-head .hello::before{content:"";width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--violet))}
.page-head h1 em{font-style:normal;background:linear-gradient(100deg,var(--g1) 10%,var(--violet) 60%,var(--cyan) 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
.page-head p.lead b{color:var(--ink);font-weight:600}
.card{background:radial-gradient(520px circle at var(--mx,-999px) var(--my,-999px),var(--spot),transparent 62%),var(--card);border-color:var(--card-line)}
.card-h{padding:18px 22px 0}
.card-h h2{font-size:15.5px;letter-spacing:-.005em}
.card-b{padding:14px 22px 20px}
.chip{font-size:11px;padding:3px 9px;letter-spacing:.01em}
.chip.live::before{animation:lp-beat 1.8s infinite}
.chip.closed::before,.chip.draft::before,.chip.analysis::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.seg{border-radius:11px;background:var(--soft)}
.seg button{border-radius:8px;transition:background .2s,color .2s,box-shadow .2s}
.alink svg{transition:transform .3s var(--ease)}
.alink:hover{text-decoration:none}
.alink:hover svg{transform:translateX(3px)}

/* tables */
.t th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--faint);padding:10px 12px}
.t td{padding:14px 12px}
.t tbody tr{position:relative}
.t tbody tr:hover{background:var(--hover)}
.t tbody tr td:first-child{border-radius:12px 0 0 12px}.t tbody tr td:last-child{border-radius:0 12px 12px 0}
.t .name .fi{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent-soft),var(--paper));border:1px solid var(--accent-line);transition:transform .3s var(--ease)}
.t tr:hover .name .fi{transform:scale(1.06) rotate(-4deg)}
.t .name b{font-size:14px}
.pgr .bar{height:6px;background:var(--line-2)}
.pgr .bar i,.qcard .bar i,.hbar .tr i,.mini-h .tr i,.qe-bar i,.lp-mini i{background:linear-gradient(90deg,var(--g1),var(--g2))}
.team span{box-shadow:0 0 0 2px var(--paper);border:0}

/* ---------- HERO: live project ---------- */
.hero{overflow:hidden;background:var(--hero-bg);border-radius:24px;box-shadow:var(--shadow-hi)}
.hero-g{display:grid;grid-template-columns:292px minmax(0,1fr)}
.hero-l{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 20px 22px;background:var(--hero-side);border-right:1px solid var(--line-2);overflow:hidden}
.hero-l::before{content:"";position:absolute;width:340px;height:340px;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent 70%);opacity:.28;animation:heroPulse 4.5s ease-in-out infinite}
@keyframes heroPulse{50%{opacity:.5;transform:translate(-50%,-50%) scale(1.08)}}
.hg{position:relative;width:216px;height:216px}
.hg svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.hg-ticks{fill:none;stroke:var(--faint);stroke-width:5;stroke-dasharray:.5 3.5;opacity:.45}
.hg-track{fill:none;stroke:var(--line-2);stroke-width:14}
.hero .hg-track{stroke:color-mix(in srgb,var(--accent) 10%,var(--line-2))}
.hg-arc{fill:none;stroke-width:14;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--p,0));transition:stroke-dashoffset 1s var(--ease);animation:hgIn 1.5s var(--ease) both;filter:drop-shadow(0 4px 10px var(--glow))}
@keyframes hgIn{from{stroke-dashoffset:1}}
.hg.zero .hg-arc,.hg.zero .hg-dot{display:none}
.hg-dot{transform-origin:110px 110px;transform:rotate(calc(var(--p,0) * 360deg));transition:transform 1s var(--ease);animation:hgDot 1.5s var(--ease) both}
@keyframes hgDot{from{transform:rotate(0deg)}}
.hg-dot circle{fill:#fff;stroke:var(--g1);stroke-width:3.5}
.hg-dot .halo{fill:var(--g1);stroke:none;opacity:.35;transform-origin:198px 110px;animation:halo 2s ease-out infinite}
@keyframes halo{from{transform:scale(.6);opacity:.5}to{transform:scale(2.4);opacity:0}}
.hg.still .halo{display:none}
.hg-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.hg-c b{font-family:var(--display);font-weight:600;font-size:58px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.hg-c span{font-size:12.5px;color:var(--muted);margin-top:6px}
.hg-c em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-top:8px;font-variant-numeric:tabular-nums}
.hg.sm{width:168px;height:168px}.hg.sm .hg-c b{font-size:44px}
.lp-num.flash{animation:numFlash 1s ease-out}
@keyframes numFlash{0%{color:var(--ok);transform:translateY(-3px) scale(1.04)}100%{color:inherit;transform:none}}
.hero-l .lp-live{position:relative;z-index:1}
.lp-live{height:26px;padding:0 11px;font-size:11.5px;letter-spacing:.02em;border:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.lp-live.draft{background:var(--warn-soft);color:var(--warn)}.lp-live.draft i{background:var(--warn);animation:none}
.lp-live.analysis{background:var(--accent-soft);color:var(--accent-deep)}.lp-live.analysis i{background:var(--accent);animation:none}
.lp-live.closed{background:var(--soft);color:var(--ink-2)}.lp-live.closed svg{width:13px;height:13px;stroke-width:2.4}
.hero-r{min-width:0;display:flex;flex-direction:column}
.hero-h{display:flex;align-items:flex-start;gap:16px;padding:24px 26px 0}
.hero-h .ey{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.hero-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.025em;line-height:1.1}
.hero-h p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.hero-h .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0}

/* stepper */
.hs{list-style:none;margin:0;padding:22px 26px 6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.hs-i{position:relative;min-width:0}
.hs-i a{display:block;padding:4px 10px 10px 0;border-radius:12px}
.hs-i:not(:last-child)::before{content:"";position:absolute;left:44px;right:8px;top:21px;height:2px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)}
.hs-i.done:not(:last-child)::before{background:linear-gradient(90deg,var(--g1),var(--g2))}
.hs-i.now:not(:last-child)::before{background:repeating-linear-gradient(90deg,var(--g1) 0 5px,transparent 5px 10px);background-size:10px 2px;animation:flow .7s linear infinite;-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--p,0)*100%),rgba(0,0,0,.22) calc(var(--p,0)*100% + 1px));mask-image:linear-gradient(90deg,#000 calc(var(--p,0)*100%),rgba(0,0,0,.22) calc(var(--p,0)*100% + 1px))}
@keyframes flow{to{background-position:10px 0}}
.hs-n{position:relative;display:grid;place-items:center;width:36px;height:36px;margin:4px 0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--faint);transition:transform .3s var(--ease),box-shadow .3s}
.hs-n svg{width:17px;height:17px}
.hs-i a:hover .hs-n{transform:translateY(-2px)}
.hs-i.done .hs-n{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.hs-i.done .hs-n svg{stroke-width:2.6}
.hs-i.now .hs-n{border-color:transparent;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 10px 22px -8px var(--glow)}
.hs-i.next .hs-n{border-style:dashed}
.hs-n .lp-ring{inset:-2px;border-radius:14px;border-color:var(--g1)}
.hs-i b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-i.next b{color:var(--muted)}
.hs-i small{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
.hs-i.now small{color:var(--ok);font-weight:600}
.hs-i.now small i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:lp-beat 1.8s infinite}
.hs-i.now.q small{color:var(--warn)}.hs-i.now.q small i{background:var(--warn);animation:none}
.hs-i.now.a small{color:var(--accent-deep)}.hs-i.now.a small i{background:var(--accent);animation:none}

/* hero stat tiles */
.hk{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:12px;padding:12px 26px 22px;margin-top:auto}
.hk-i{position:relative;padding:14px 16px;border-radius:16px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--paper-2) 70%,transparent);min-width:0;transition:border-color .25s,transform .3s var(--ease)}
.hk-i:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.hk-i>small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hk-i>b{display:flex;align-items:baseline;gap:5px;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.hk-i>b i{font-style:normal;font-family:DedaleInter,sans-serif;font-size:13px;font-weight:500;color:var(--faint);letter-spacing:0}
.hk-bar{display:block;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:10px}
.hk-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .9s var(--ease);transform-origin:left;animation:grow 1.1s var(--ease) both}
.hk-pace{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:end}
.hk-pace>small{grid-column:1/-1}
.hk-pace>b{font-size:22px;white-space:nowrap;align-self:center;margin:0}
.hk-pace .cap{grid-column:1;font-size:12px;color:var(--muted);white-space:nowrap}
.pace{grid-column:2;grid-row:2/4;position:relative;height:56px;min-width:0}
.pace svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pace .pl{fill:none;stroke:var(--g1);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pace .pa{fill:url(#paceFill);opacity:0;animation:fadeIn .8s 1s forwards}
.pace .pp{fill:none;stroke:var(--faint);stroke-width:1.4;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:.8}
.pace .pt{fill:none;stroke:var(--ok);stroke-width:1.2;stroke-dasharray:2 4;vector-effect:non-scaling-stroke;opacity:.7}
.pace-dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--paper);border:2.5px solid var(--g1);opacity:0;animation:fadeIn .4s 1.7s forwards}
.pace-dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--g1);opacity:0;animation:lp-ring 2s ease-out infinite 1.8s}
.pace-dot.still::after{display:none}

/* hero footer: live feed */
.hf{display:flex;align-items:center;gap:14px;padding:13px 26px;border-top:1px solid var(--line-2);background:color-mix(in srgb,var(--paper-2) 60%,transparent);font-size:13px;min-height:50px}
.hf-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.hf-ic svg{width:14px;height:14px}
.hf-ic.live{background:var(--ok-soft);color:var(--ok)}
.hf-ic.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:lp-beat 1.8s infinite}
.hf-ic.warn{background:var(--warn-soft);color:var(--warn)}
.hf-msg{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hf-msg b{font-weight:600;color:var(--ink);margin-right:6px}
.hf-msg small{color:var(--faint);margin-left:8px;font-size:12px}
.hf-msg.in{animation:feedIn .6s var(--ease)}
@keyframes feedIn{from{opacity:0;transform:translateY(8px);filter:blur(3px)}}
@media (max-width:1100px){.hero-g{grid-template-columns:1fr}.hero-l{border-right:0;border-bottom:1px solid var(--line-2);flex-direction:row;justify-content:flex-start;gap:22px;padding:20px 26px}.hg{width:150px;height:150px}.hg-c b{font-size:40px}}
@media (max-width:760px){.hs{grid-template-columns:1fr;gap:2px;padding:16px 20px 6px}.hs-i a{display:grid;grid-template-columns:36px 1fr;column-gap:12px;align-items:center;padding:4px 0}.hs-n{grid-row:1/3;margin:0}.hs-i:not(:last-child)::before{left:17px;right:auto;top:42px;bottom:-6px;width:2px;height:auto;animation:none;-webkit-mask-image:none;mask-image:none}.hk{grid-template-columns:1fr 1fr;padding:12px 20px 18px}.hk-pace{grid-column:1/-1}.hero-h{flex-wrap:wrap;padding:20px 20px 0}.hero-h h2{font-size:23px}.hf{padding:12px 20px}.hf .alink{display:none}.hero-l{padding:18px 20px}}

/* ---------- overview: survey cards + needs you ---------- */
.ov-grid{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:20px;margin-top:22px;align-items:start}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 2px 14px}
.sec-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.02em}
.sec-h span{font-size:13px;color:var(--muted)}
.sec-h .alink{margin-left:auto}
.sv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sv{display:flex;flex-direction:column;gap:14px;padding:18px 20px 16px;border-radius:20px;transition:transform .35s var(--ease),box-shadow .35s,border-color .25s,opacity .55s var(--ease)}
.sv:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:var(--accent-line)}
.sv.rvl.in:hover{transform:translateY(-3px)}
.sv-top{display:flex;align-items:center;gap:10px}
.sv-top .upd{margin-left:auto;font-size:12px;color:var(--faint)}
.sv h3{margin:0;font-family:var(--display);font-weight:600;font-size:17.5px;letter-spacing:-.015em;line-height:1.2}
.sv p{margin:4px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-dots{display:flex;gap:5px}
.sv-dots i{flex:1;height:4px;border-radius:2px;background:var(--line-2);position:relative;overflow:hidden}
.sv-dots i.d{background:linear-gradient(90deg,var(--g1),var(--g2))}
.sv-dots i.n{background:var(--accent-soft)}
.sv-dots i.n::after{content:"";position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:linear-gradient(90deg,transparent,var(--g1),transparent);animation:lp-sweep 1.7s ease-in-out infinite alternate}
.sv-foot{display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line-2);margin-top:auto}
.sv-foot .num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sv-foot .num b{font-family:var(--display);font-size:17px;color:var(--ink);font-weight:600}
.sv-foot .go{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent-deep)}
.sv-foot .go svg{width:16px;height:16px;transition:transform .3s var(--ease)}
.sv:hover .go svg{transform:translateX(4px)}
.needs .attn li{grid-template-columns:38px 1fr 20px;padding:13px 8px;margin:0 -8px;border-radius:14px;border-top:0;transition:background .2s}
.needs .attn li:hover{background:var(--hover)}
.needs .attn li+li{box-shadow:0 -1px 0 var(--line-2)}
.needs .attn li:hover,.needs .attn li:hover+li{box-shadow:none}
.needs .attn a{display:contents;color:inherit}
.needs .attn .ic{width:38px;height:38px;border-radius:12px}
.needs .attn .go{color:var(--faint);width:16px;height:16px;transition:transform .3s var(--ease),color .2s}
.needs .attn li:hover .go{transform:translateX(3px);color:var(--accent)}
.sec-h span.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--violet));color:#fff;font-size:11.5px;font-weight:700}
.ai-card{margin-top:16px;position:relative;border-radius:20px;padding:1.5px;background:conic-gradient(from var(--ang),var(--g1),var(--violet),var(--cyan),var(--g1));animation:ang 6s linear infinite;box-shadow:0 20px 44px -26px rgba(122,90,248,.7)}
.ai-card>div{border-radius:18.5px;background:var(--paper);padding:16px 18px;display:grid;grid-template-columns:42px 1fr;gap:4px 14px;align-items:center}
.ai-card .orb{grid-row:1/3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#fff 0,#b8c9ff 18%,#245cf4 52%,#7a5af8 100%);animation:hw-breathe 2.4s ease-in-out infinite}
.ai-card .orb svg{width:19px;height:19px;fill:#fff;stroke:none}
.ai-card b{font-size:14px}.ai-card p{margin:0;font-size:12.5px;color:var(--muted);grid-column:2}
.ai-card button{grid-column:1/-1;margin-top:10px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);font-size:13px;color:var(--faint);text-align:left;background:var(--paper-2);transition:border-color .2s,box-shadow .2s}
.ai-card button:hover{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.ai-card button svg{margin-left:auto;width:15px;height:15px;color:var(--accent)}
.ai-card .tw::after{content:"";display:inline-block;width:1.5px;height:14px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:1180px){.ov-grid{grid-template-columns:1fr}}
@media (max-width:700px){.sv-grid{grid-template-columns:1fr}.page-head h1{font-size:31px}}

/* ---------- fieldwork ---------- */
.fw-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px}
.fw-g{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;padding:24px 26px}
.fw-facts{display:grid;gap:0}
.fw-facts>div{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--line-2)}
.fw-facts>div:first-child{border-top:0}
.fw-facts dt{font-size:12.5px;color:var(--muted)}
.fw-facts dd{margin:0 0 0 auto;font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fw-facts dd small{font-family:DedaleInter,sans-serif;font-size:12px;font-weight:500;color:var(--faint)}
.fw-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fw-h b{font-size:15.5px}
.days{display:flex;align-items:flex-end;gap:8px;height:178px;padding-top:22px}
.day{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.day i{position:relative;display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:color-mix(in srgb,var(--g1) 32%,var(--paper));transform-origin:bottom;animation:growY .9s var(--ease) both;transition:height .8s var(--ease)}
.day i b{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.day.today i{background:linear-gradient(180deg,var(--g2),var(--g1));box-shadow:0 10px 20px -8px var(--glow)}
.day.today i::after{content:"";position:absolute;left:0;right:0;top:0;height:40%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);animation:blinkSoft 1.8s ease-in-out infinite}
@keyframes blinkSoft{50%{opacity:.2}}
.day.today{color:var(--accent-deep);font-weight:700}
.day.future i{height:6px!important;background:none;border:1.5px dashed var(--line);border-radius:4px;animation:none}
.card.rvl:not(.in) .day i{animation-play-state:paused}
.fw-q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}
.fw-q.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.qr{padding:11px 0;border-top:1px solid var(--line-2)}
.qr:first-child{border-top:0;padding-top:4px}
.qr-h{display:flex;align-items:baseline;gap:10px;font-size:13.5px}
.qr-h b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr-h span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.qr-h span b{color:var(--ink);font-size:13.5px}
.qr-bar{position:relative;height:8px;border-radius:5px;background:var(--line-2);margin-top:8px;overflow:hidden}
.qr-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .9s var(--ease);transform-origin:left;animation:grow 1s var(--ease) both}
.qr.met .qr-bar i{background:linear-gradient(90deg,var(--ok),#63c79b)}
.qr.met .qr-h span{color:var(--ok);font-weight:600}
.qr.met .qr-h span b{color:var(--ok)}
.qr.bump .qr-h span b{animation:numFlash 1s ease-out;display:inline-block}
.card.rvl:not(.in) .qr-bar i{animation-play-state:paused}
@media (max-width:1100px){.fw-top,.fw-q,.fw-q.two{grid-template-columns:1fr}}
@media (max-width:560px){.fw-g{grid-template-columns:1fr;justify-items:center}.fw-facts{width:100%}}

/* ---------- polish on existing screens ---------- */
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kpi b{font-size:38px;letter-spacing:-.03em;margin-top:6px}
.qcard b,.stat b{letter-spacing:-.02em}
.hbar .tr{height:10px;border-radius:6px}
.hbar .tr i{border-radius:6px}
.hbar{transition:transform .25s var(--ease)}
.hbar:hover{transform:translateX(3px)}
.vcols i{border-radius:10px 10px 3px 3px;background:var(--accent-line)}
.vcols div:nth-child(2) i{background:linear-gradient(180deg,var(--g2),var(--g1));box-shadow:0 12px 22px -10px var(--glow)}
.heat{border-spacing:4px}
.heat td{border-radius:9px;transition:transform .2s var(--ease),box-shadow .2s}
.heat td:not(:first-child):hover{transform:scale(1.06);box-shadow:0 6px 16px -8px var(--glow)}
.filters{border-radius:16px;box-shadow:var(--shadow)}
.interim{border-radius:16px;border:1px solid color-mix(in srgb,currentColor 16%,transparent)}
.brief-item{border-radius:14px;transition:border-color .2s,transform .3s var(--ease)}
.brief-item:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.brief-item small{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.nx-ic,.attn .ic{background:linear-gradient(135deg,var(--accent-soft),var(--paper));border:1px solid var(--accent-line)}
.attn .ic.w{background:var(--warn-soft);border-color:transparent}.attn .ic.g{background:var(--ok-soft);border-color:transparent}

/* ===================== v5: accessibility, legibility, data clarity ===================== */
:root{--faint:#65738a;--muted:#55647b}
:root[data-theme="dark"]{--faint:#8b99b3;--muted:#a3b0c6}
.navlabel,.t th,.hk-i>small,.kpi small,.brief-item small,.hero-h .ey,.page-head .hello{font-size:11px}
.chip,.nav-btn .badge,.skin,.lp-live{font-size:11.5px}
.day{font-size:11.5px}.hg-c em{font-size:12px}.sv-top .upd,.hs-i small,.hk-pace .cap{font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a.card:focus-visible,.sv:focus-visible{outline-offset:4px;border-radius:20px}
@media (pointer:coarse){.nav-btn{min-height:44px}.subnav a{min-height:40px}.icb,.collapse{width:44px;height:44px}.btn{min-height:44px}.seg button{min-height:38px}.sl-foot button,.prompts button{min-height:40px}}
/* live pill in the top bar */
.livepill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ok) 28%,transparent);background:var(--ok-soft);color:var(--ok);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s}
.livepill:hover{transform:translateY(-1px);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 14%,transparent)}
.livepill i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:lp-beat 1.8s infinite}
.livepill b{color:var(--ink);font-weight:700}
.livepill.paused{background:var(--soft);color:var(--muted);border-color:var(--line)}.livepill.paused i{background:var(--muted);animation:none}
@media (max-width:1100px){.livepill span{display:none}}@media (max-width:900px){.livepill{display:none}}
/* odometer */
.odo{display:inline-flex;overflow:hidden;height:1em;line-height:1}
.odo span{display:block;transition:transform .9s var(--ease)}
.odo span i{display:block;height:1em;font-style:normal}
/* pause control on the live feed */
.hf-pause{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600;color:var(--ink-2);flex-shrink:0;transition:border-color .2s,box-shadow .2s}
.hf-pause:hover{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.hf-pause svg{width:13px;height:13px;fill:currentColor;stroke:none}
.is-paused .hf-ic.live i,.is-paused .hs-i.now small i,.is-paused .lp-live i{animation:none;opacity:.5}
.is-paused .lp-ring,.is-paused .halo,.is-paused .pace-dot::after{display:none}
.is-paused .hs-i.now:not(:last-child)::before{animation-play-state:paused}
/* pace legend */
.pace-lg{grid-column:1/-1;display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.pace-lg span{display:inline-flex;align-items:center;gap:6px}
.pace-lg i{width:14px;height:0;border-top:2px solid var(--g1)}
.pace-lg .f i{border-top:2px dashed var(--faint)}.pace-lg .t i{border-top:2px dotted var(--ok)}
/* tooltips on day bars */
.day{position:relative;cursor:default;outline-offset:2px;border-radius:8px}
.day[data-tip]::before{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% - 14px);transform:translate(-50%,4px);padding:5px 9px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .2s var(--ease);z-index:3}
.day[data-tip]:hover::before,.day[data-tip]:focus-visible::before{opacity:1;transform:translate(-50%,0)}
.day:hover i{filter:brightness(1.08)}
/* KPI gauges */
.kpi{padding-right:96px}
.kg{position:absolute;right:18px;top:22px;width:68px;height:40px;overflow:visible}
.kg path{fill:none;stroke-width:7;stroke-linecap:round}
.kg .t{stroke:var(--line-2)}
.kg .v{stroke:url(#kgG);stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s .15s var(--ease)}
.kpi.in .kg .v,.kpi:not(.rvl) .kg .v{stroke-dashoffset:var(--o)}
@media (max-width:1100px){.kpi{padding-right:20px}.kg{display:none}}
/* heat legend */
.heat-lg{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--muted)}
.heat-lg i{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(36,92,244,.06),rgba(36,92,244,.42))}
/* stage dots in tables */
.sv-dots.mini{width:74px;margin-top:7px;gap:3px}.sv-dots.mini i{height:3px}
.t td .chip{vertical-align:top}
.hg-c .odo,.hg-c .odo span{font-size:inherit;color:inherit;margin:0}
.hg-c .odo{font-size:1em}
.fw-top>*,.fw-q>*,.view>.grid>*{min-width:0}
@media (max-width:900px){.hiw{grid-template-columns:minmax(0,1fr);padding:18px;gap:18px}.hiw>*{min-width:0}.hw-panel{min-height:0}.view>.grid{grid-template-columns:minmax(0,1fr)!important}.days{gap:4px}.fw-g{padding:20px}.hbar{grid-template-columns:118px 1fr 44px!important}}
.split>*,.rvw>*,.rv-stage>*,.main{min-width:0}
.crumbs{overflow:hidden;white-space:nowrap}.crumbs b{overflow:hidden;text-overflow:ellipsis}
@media (max-width:1180px){.rvw,.rv-stage{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.page-head .actions{max-width:100%}}
.day[data-tip]::before{display:none;opacity:1;transform:translate(-50%,0)}
.day[data-tip]:hover::before,.day[data-tip]:focus-visible::before{display:block;animation:tipIn .2s var(--ease)}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,4px)}}


/* ===================== v6 ===================== */
/* scoping */
.sc-split{grid-template-columns:330px minmax(0,1fr)}
.mail-list .ml-st{margin-top:6px;font-size:12px;font-weight:600;color:var(--accent-deep)}

.scflow{list-style:none;margin:2px 0 18px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scflow li{position:relative;padding:10px 12px;border-radius:14px;border:1px solid var(--line-2);background:var(--paper-2);display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 9px;align-items:center}
.scflow li span{grid-row:1/3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);color:var(--faint);background:var(--paper)}
.scflow li span svg{width:13px;height:13px;stroke-width:2.6}
.scflow li b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.scflow li small{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scflow li.done span{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.scflow li.done b{color:var(--ink)}
.scflow li.now{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}
.scflow li.now span{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff}
.scflow li.now b{color:var(--accent-deep)}
.sc-att{display:flex;width:100%;margin-bottom:16px}
.sc-att .btn{margin-left:auto;padding:6px 12px}
.scgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scf{display:grid;gap:6px;min-width:0}
.scf.wide{grid-column:1/-1}
.scf>span:first-child{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.scf input,.scf textarea,.pp-f input,.np-name{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);background:var(--paper-2);transition:border-color .2s,box-shadow .2s,background .2s;resize:vertical}
.scf textarea{line-height:1.5}
.scf input:hover,.scf textarea:hover,.pp-f input:hover{border-color:var(--accent-line)}
.scf input:focus,.scf textarea:focus,.pp-f input:focus,.np-name:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--paper)}
.scf-i{position:relative;display:block}
.scf-i i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12.5px;color:var(--faint);pointer-events:none}
.scf-i:has(i) input{padding-right:96px;font-family:var(--display);font-weight:600;font-size:16px}
.scf-e{color:var(--del);font-size:12px;font-weight:600}
.aitag{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 7px 1px 5px;border-radius:999px;color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent)}
.aitag svg{width:11px;height:11px;fill:currentColor;stroke:none}
.scf.pop input,.scf.pop textarea{animation:aiFill 1.4s var(--ease) both}
.scf.pop:nth-child(2) *{animation-delay:.12s}.scf.pop:nth-child(3) *{animation-delay:.24s}.scf.pop:nth-child(4) *{animation-delay:.36s}.scf.pop:nth-child(5) *{animation-delay:.48s}
@keyframes aiFill{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 35%,transparent);border-color:var(--violet);background:color-mix(in srgb,var(--violet) 8%,var(--paper))}100%{box-shadow:0 0 0 0 transparent}}
.sc-note{display:flex;align-items:center;gap:7px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.sc-note svg{width:14px;height:14px;color:var(--violet)}
.sc-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.sc-h{margin:0 0 10px;font-size:13.5px}
.sc-hint{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.pp-l{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:32px;align-items:center}
.pp-e{font-size:12.5px;color:var(--faint)}
.pchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;height:32px;padding:0 6px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;white-space:nowrap}
.pchip .av{width:24px;height:24px;font-size:9.5px;font-style:normal}
.pchip .av.cl{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.pchip small{color:var(--faint);padding-right:6px}
.pchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.pchip button:hover{background:var(--del-soft);color:var(--del)}
.pchip button svg{width:12px;height:12px}
.pp-f{display:flex;gap:8px}
.pp-f input{padding:8px 12px;font-size:13px;min-width:0}
.pp-f input:disabled{opacity:.5;cursor:not-allowed}
.pp-f .btn:disabled{opacity:.45;cursor:not-allowed}
.sc-act{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2)}
.sc-act .sc-hint{margin:0}
.btn.nudge{animation:shake .4s}
/* new project */
.np{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.np-b{padding-top:22px}
.np-name{border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:none;padding:4px 0 12px;font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em}

@media (max-width:700px){.sc-two{grid-template-columns:minmax(0,1fr)}}
/* type picker */

.tp-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.tp-pop{position:absolute;left:0;top:calc(100% + 8px);z-index:12;width:min(620px,74vw);columns:3 170px;column-gap:6px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 30px 70px -30px rgba(10,20,40,.55);animation:pop .25s var(--ease)}

.tp-g button.on{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}

/* new respondent atoms */
.rq-dd{position:relative;display:block}
.rq-dd select{appearance:none;width:100%;border:1.5px solid #e2e8f1;border-radius:12px;padding:12px 36px 12px 12px;font:inherit;font-size:13.5px;color:#152440;background:#fff}

.rq-mdr button.on{background:#2e7d5b;border-color:#2e7d5b}.rq-mdr button.w.on{background:#b4432f;border-color:#b4432f}

function placeInd(){
  const w=$('#navwrap'),ind=$('#navInd');if(!w)return;

  ind.style.opacity=1;ind.style.width=r.width+'px';ind.style.height=r.height+'px';
  ind.style.transform=`translate(${r.left-wr.left}px,${r.top-wr.top+w.scrollTop}px)`;

/* ---------------- router ---------------- */
function parse(){
  const p=location.hash.replace(/^#\/?/,'').split('/');
  const n=ALLNAV.find(x=>x.id===p[0])||ALLNAV[0];
  const sub=n.subs.some(s=>s[0]===p[1])?p[1]:n.subs[0][0];
  if(p[2]&&byId(p[2]))PROJ=p[2];
  return {sec:n.id,sub};
}
let lastSec=null;
document.documentElement.classList.toggle('vt',!!document.startViewTransition&&!RM);
function render(){
  const prevSec=route.sec,prevProj=render.proj;
  route=parse();openSec=route.sec;renderNav();
  const n=ALLNAV.find(x=>x.id===route.sec),s=n.subs.find(x=>x[0]===route.sub),inP=PSEC.includes(route.sec);
  $('#crumbs').innerHTML=inP?`<a href="#/surveys/all">Projects</a>${ico('chev')}<a href="${href('project','home')}">${P().name}</a>${ico('chev')}<b>${n.subs.length>1?n.label+', '+s[1]:n.label}</b>`:`<span>Workspace</span>${ico('chev')}<span>${n.label}</span>${ico('chev')}<b>${s[1]}</b>`;
  $('#projectChip').hidden=!inP;

  const swap=()=>{$('#main').innerHTML=`<div class="view">${VIEWS[route.sec](route.sub)}</div>`;after(route.sec,route.sub);motion($('#main'));};
  if(!anchorOnly){
    if(document.startViewTransition&&!RM&&lastSec!==null)document.startViewTransition(swap);else swap();
  }

  else scrollTo(0,0);
  lastSec=route.sec;render.proj=PROJ;
}
